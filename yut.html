    setKing(c.bonus ? "세 문제를 내리 맞혔구나! 상으로 내 찬스를 하나 주마."
          : TEAM() ? (left>0 ? `옳거니! 별 ${left}개만 더 모으면 되느니라.` : left===0 ? "목표한 별을 모두 모았도다! 끝까지 힘을 내 보거라." : "옳거니! 별이 자꾸자꾸 늘어나는구나.")
          : S.daily ? pickOne(["옳거니! 잘 맞혔도다.","과연 한글 박사로다!","훌륭하도다!"])
          : S.mode==="quiz" ? pickOne(["옳거니! 별을 하나 받거라.","과연 한글 박사로다!","훌륭하도다! 집현전 학사들도 놀라겠구나."])
          : S.mode==="yut" ? pickOne(["옳거니! 윷을 던지러 가자꾸나.","과연 한글 박사로다! 윷을 던지거라.","훌륭하도다! 윷가락을 잡거라."])
          : pickOne(["옳거니! 카드를 뒤집어 보거라.","과연 한글 박사로다!","훌륭하도다! 어느 카드를 고를꼬?"]),"happy");
    SFX.right(); confetti(60);
  }else{
    c.state="wrong"; S.streak[c.pi]=0;
    setKing(pickOne(["괜찮노라. 이제 알았으니 됐노라!","아깝도다! 다음 문제는 꼭 맞히리라.","틀리면서 배우는 것이니라."]),"sad"); SFX.wrong();
  }
  render();
}
/* 힘 모으기(차례 퀴즈): 겨루지 않고 모두의 별을 합친다. 목표는 전체 문제의 열에 일곱. 세종대왕 찬스도 함께 쓴다 */
/* 중도 포기: 한 사람이 놀이 중간에 빠질 수 있다. 빠진 사람은 차례를 건너뛰고, 상장은 '함께상'으로 받는다 */
const ON = i => !(S.out&&S.out[i]);
const ACT = () => PI().filter(ON);
const TEAM = () => S.mode==="quiz"&&!!S.opt.team&&!S.daily;
const teamStars = () => S.score.reduce((a,b)=>a+b,0);
const teamGoal = () => { const r=(S.qz&&S.qz.rounds)||5; return Math.ceil(PI().reduce((a,i)=>a+(ON(i)?r:Math.min(r,(S.outQ&&S.outQ[i])||0)),0)*0.7); };
const OURS = () => N()>1 ? "모두의 별" : "내 별";
const chanceOf = pi => TEAM() ? S.chance.reduce((a,b)=>a+b,0) : S.chance[pi];
function teamBar(){ const s=teamStars(), g=teamGoal(); return `<div class="teambar${s>=g?" done":""}" role="img" aria-label="${OURS()} ${s}개, 목표 ${g}개"><span class="tbtrack"><i style="width:${Math.min(100,Math.round(s/g*100))}%"></i></span><b>⭐ ${s} / ${g}</b></div>`; }
function useChance(){
  const c=S.cur; if(!c||c.state!=="open"||busy||chanceOf(c.pi)<1) return;
  const live=c.order.filter(ci=>!c.off.includes(ci)), wrong=live.filter(ci=>ci!==0);
  if(live.length<=2||!wrong.length) return;
  const x=pickOne(wrong), who=S.chance[c.pi]>0 ? c.pi : S.chance.findIndex(v=>v>0); c.off.push(x); shakeIdx=x; S.chance[who]--;
  setKing("내 도와주마! 이것은 답이 아니니라.","wave"); SFX.chance(); render();
}
function afterQuestion(){
  const c=S.cur; if(!c||busy||(c.state!=="right"&&c.state!=="wrong")) return;
  const ok=c.state==="right"; S.cur=null;
  if(S.daily){ if(ok) S.dy.right++; S.dy.i++; if(S.dy.i>=S.dy.qs.length) dailyEnd(); else dailyAsk(); return; }
  if(S.mode==="mem"){ memAfterQ(ok); return; }
  if(S.mode==="quiz"){ quizNext(); return; }
  S.phase="board";
  if(ok){ S.b={st:"throw", msg:"정답! 윷을 던져요"}; setKing("자, 윷을 높이 던져 보거라!","wave"); }
  else  { S.b={st:"rest"}; setKing("이번에는 쉬어 가거라. 다음에는 꼭 맞히리라.","sad"); }
  render();
}

/* ================= 차례 퀴즈 ================= */
/* 가장 단순한 놀이: 정한 차례대로 한 문제씩 풀고, 맞히면 별 하나. 모두 정해진 문제 수를 풀면 끝난다 */
function quizStart(){ S.qz={round:0, rounds:[5,7,10].includes(S.opt.qn)?S.opt.qn:5}; quizTurn(); }
function quizTurn(){
  S.phase="turn";
  setKing(TEAM()&&S.qz.round===0&&S.ti===0 ? (N()>1 ? `모두 힘을 모아 별 ${teamGoal()}개를 모아 보자꾸나. ${nm(cur())}부터 시작이로다.` : `별 ${teamGoal()}개를 모으면 성공이로다. 어디 한번 해 보거라.`) : `${nm(cur())} 차례로다. 문제를 받거라.`,"idle"); render();
}
function quizNext(){
  if(!ACT().length){ endGame(); return; }
  do{ S.ti++; if(S.ti>=N()){ S.ti=0; S.qz.round++; } }while(S.qz.round<S.qz.rounds&&!ON(cur()));
  if(S.qz.round>=S.qz.rounds){ endGame(); return; }
  quizTurn();
}
function viewTurn(){
  const i=cur(), z=S.qz;
  return `<div class="eyebrow">${z.round+1}번째 문제 · 한 사람에 ${z.rounds}문제</div>
    <div class="hero">${full(i,"wave")}</div>
    <h2>${nmH(i)} 차례</h2>
    <p class="sub">${LV[S.players[i].lv].n} 단계 · ${TEAM()&&N()>1?"내가 모은 별":"지금까지 별"} ${S.score[i]}개${chanceOf(i)>0?` · ${TEAM()&&N()>1?"모두의 찬스":"찬스"} ${chanceOf(i)}개`:""}</p>
    ${TEAM()?`<div class="teambox"><span>${OURS()} · 목표 ${teamGoal()}개</span>${teamBar()}</div>`:""}
    <button class="btn" id="askBtn" data-act="ask">문제 받기</button>`;
}

/* ================= 윷놀이 ================= */
function beginTurn(again){
  const i=cur();
  S.phase="board"; S.t={again:false, log:""}; S.b={st:"turn", again:!!again};
  setKing(again ? "한 번 더 풀 기회로다!" : nm(i)+" 차례로다. 문제를 받거라.","idle");
  render();
}
function note(msg,king,mood){ S.b.msg=msg; S.t.log=msg; setKing(king,mood); renderCenter(); renderKing(); }
function throwYut(){
  if(busy||S.phase!=="board"||S.b.st!=="throw") return; busy=true;
  S.t.hit=[];                                           // 던질 때마다 새로 센다(윷·모로 한 번 더 던질 때도)
  const id=cur(), sticks=[0,0,0,0].map(()=>Math.random()<.5), flats=sticks.filter(Boolean).length;
  const back = flats===1&&sticks[0];                    // 빨간 점 윷가락만 젖혀지면 빽도
  const res = back ? {k:"빽도",n:-1} : YUT[flats];
  const n = res.n;
  S.b={st:"toss", sticks, res, tilt:sticks.map(()=>Math.round(Math.random()*24-12))};
  setKing("두구두구… 무엇이 나올꼬?","think"); SFX.toss(); SFX.drum(); render();
  setTimeout(()=>{
    if(S.phase!=="board") return;
    S.b.st="move";
    if(back){ note("빽도! 한 칸 뒤로","허허, 빽도로다! 한 칸 물러서거라.","sad"); SFX.yut(1); SFX.back(); }
    else{
      note(`${res.k}! ${NUMK[res.n]} 칸 앞으로`, res.n>=4 ? `${res.k}! 윷놀이에서는 윷이나 모가 나오면 한 번 더 던지느니라.` : `${res.k}! ${NUMK[res.n]} 칸 가거라.`, "happy");
      SFX.yut(res.n);
    }
    setTimeout(()=>moveBy(id, n, landed), wait(550));      // 빽도로 물러선 칸에서도 그 칸의 일(바나나, 지름길, 미션, 열쇠, 만남)이 그대로 일어난다
  }, wait(950));
}
function moveBy(id,n,cb){
  const F=S.opt.len, dir=n>0?1:-1; let left=Math.abs(n);
  const step=()=>{
    if(left<=0||(dir>0&&S.pos[id]>=F)||(dir<0&&S.pos[id]<=0)){ cb(); return; }
    S.pos[id]+=dir; left--; placeTokens(); SFX.step();
    setTimeout(step, wait(250));
  };
  step();
}
function meetThen(next){
  const id=cur(), F=S.opt.len;
  const others=ACT().filter(x=>x!==id&&S.pos[x]===S.pos[id]&&S.pos[x]>0&&S.pos[x]<F);
  if(!others.length){ next(); return; }
  if(S.opt.catchOn){
    note(`잡았다! ${others.map(nm).join(", ")} 세 칸 뒤로`,"잡았구나! 한 번 더 던지거라.","happy"); SFX.grab();
    S.t.bonus=true; S.t.bonusMsg="잡았으니 한 번 더 던져요!";
    setTimeout(()=>{ others.forEach(x=>{ S.pos[x]=Math.max(0,S.pos[x]-3); }); placeTokens(); SFX.step(); setTimeout(next, wait(500)); }, wait(800));
  }else{
    note("하이파이브! 함께 한 칸 앞으로","사이좋게 만났구나! 함께 한 칸씩 가거라.","happy"); SFX.clap();
    setTimeout(()=>{ [id,...others].forEach(x=>{ S.pos[x]=Math.min(F,S.pos[x]+1); }); placeTokens(); SFX.step(); setTimeout(next, wait(500)); }, wait(800));
  }
}
/* 말이 멈춘 칸의 일을 한다. 지름길·바나나·열쇠·미션으로 옮겨 간 칸에서도 다시 이 함수를 불러, 그 칸의 일과 만남(하이파이브·잡기)을 이어서 처리한다.
   같은 칸은 한 차례에 한 번만, 이어지는 것은 네 번까지만 해서 지름길과 바나나 사이를 오가며 끝없이 도는 일을 막는다 */
function landed(){
  const id=cur(), F=S.opt.len;
  if(S.pos[id]>=F){ settle(); return; }
  const at=S.pos[id], type=CELLS[at%LAP], hit=S.t.hit||(S.t.hit=[]);
  if(type&&type!=="start"){ if(hit.includes(at)||hit.length>=4){ meetThen(settle); return; } hit.push(at); }
  if(type==="jump"){ note("지름길! 세 칸 더 앞으로","지름길이로다! 쌩쌩 달리거라.","happy"); SFX.jump(); setTimeout(()=>moveBy(id,3,landed), wait(800)); }
  else if(type==="slip"){ note("바나나를 밟았어요! 두 칸 뒤로","저런, 미끄러졌구나!","sad"); SFX.slip(); setTimeout(()=>moveBy(id,-2,landed), wait(800)); }
  else if(type==="again"){ S.t.again=true; note("문제 하나 더! 또 던질 기회예요","문제를 하나 더 풀 기회를 얻었도다!","happy"); SFX.chance(); setTimeout(()=>meetThen(settle), wait(1000)); }
  else if(type==="chance"){ S.chance[id]++; note("세종대왕 찬스를 하나 받았어요","내 찬스를 하나 더 주겠노라.","wave"); SFX.chance(); setTimeout(()=>meetThen(settle), wait(1000)); }
  else if(type==="mission"){
    busy=false;
    S.b={st:"mission", mission:nextMission(), res:S.b.res, sticks:S.b.sticks, tilt:S.b.tilt};
    setKing("미션이로다! 해내면 두 칸을 더 가느니라.","wave"); SFX.mission(); renderCenter(); renderKing();
  }else if(type==="key"){
    busy=false;
    S.b={st:"key", card:drawKey(), res:S.b.res, sticks:S.b.sticks, tilt:S.b.tilt};
    setKing("황금 열쇠로다! 무슨 일이 생길꼬?","wave"); SFX.key(); renderCenter(); renderKing();
  }else meetThen(settle);
}
function keyApply(){
  if(busy||S.phase!=="board"||S.b.st!=="key") return; busy=true;
  const id=cur(), F=S.opt.len, c=S.b.card; S.b.st="move";
  const soon=()=>setTimeout(settle, wait(700)), soonLand=()=>setTimeout(landed, wait(700));
  if(c.id==="f2"){ note("황금 열쇠: 두 칸 앞으로","좋은 열쇠로다!","happy"); moveBy(id,2,landed); }
  else if(c.id==="f4"){ note("황금 열쇠: 네 칸 앞으로","으뜸가는 열쇠로다!","happy"); moveBy(id,4,landed); }
  else if(c.id==="b1"){ note("황금 열쇠: 뒤로 한 칸","저런, 한 칸 물러서거라.","sad"); moveBy(id,-1,landed); }
  else if(c.id==="swap"){
    const ahead=ACT().filter(x=>x!==id&&S.pos[x]>S.pos[id]&&S.pos[x]<F).sort((a,b)=>S.pos[a]-S.pos[b])[0];
    if(ahead!==undefined){ [S.pos[id],S.pos[ahead]]=[S.pos[ahead],S.pos[id]]; placeTokens(); SFX.chance(); note(`황금 열쇠: ${J(nm(ahead),"과","와")} 자리를 바꿨어요`,"자리를 바꾸었도다! 판이 뒤집혔구나.","happy"); soonLand(); }
    else{ note("앞사람이 없어서 두 칸 앞으로","앞에 아무도 없구나. 두 칸 가거라.","happy"); moveBy(id,2,landed); }
  }
  else if(c.id==="f3"){ note("황금 열쇠: 세 칸 앞으로","좋은 열쇠로다!","happy"); moveBy(id,3,landed); }
  else if(c.id==="ch"){ S.chance[id]++; note("황금 열쇠: 세종대왕 찬스 한 개","내 찬스를 하나 주겠노라.","wave"); renderHUD(); soon(); }
  else if(c.id==="all"){ ACT().forEach(x=>{ if(S.pos[x]<F) S.pos[x]=Math.min(F,S.pos[x]+1); }); placeTokens(); SFX.step(); note("황금 열쇠: 모두 한 칸씩 앞으로","다 함께 한 칸씩 가거라.","happy"); soonLand(); }
  else{
    const last=ACT().filter(x=>S.pos[x]<F).sort((a,b)=>S.pos[a]-S.pos[b])[0];
    S.pos[last]=Math.min(F,S.pos[last]+3); placeTokens(); SFX.step();
    note(last===id ? "황금 열쇠: 내가 맨 뒤라서 세 칸 앞으로" : `황금 열쇠: ${nm(last)}에게 세 칸 선물`,"뒤에 있는 이를 챙기는 마음이 곱구나.","happy"); last===id ? soonLand() : soon();
  }
}
function missionEnd(done){
  if(busy||S.phase!=="board"||S.b.st!=="mission") return;
  if(!done){ S.t.log="미션은 다음에 해요"; settle(); return; }
  busy=true; S.b.st="move";
  note("미션 성공! 두 칸 더 앞으로","잘 해냈도다! 두 칸 더 가거라.","happy"); SFX.right(); confetti(40);
  setTimeout(()=>moveBy(cur(),2,landed), wait(500));
}
function settle(){
  const id=cur(), F=S.opt.len, b=S.b;
  const before=S.fin.length;
  [id,...PI().filter(x=>x!==id)].forEach(x=>{ if(S.pos[x]>=F&&!S.fin.includes(x)) S.fin.push(x); });   // 도착한 차례가 곧 등수
  busy=false;
  if(S.pos[id]>=F){
    const rank=S.fin.indexOf(id)+1, all=yutAllIn();
    S.b={st:"done", msg:`도착! ${rank}등이에요`, sticks:b.sticks, tilt:b.tilt};
    setKing(all ? "모두 도착하였도다! 끝까지 달린 모두가 장하구나!" : `${J(nm(id),"이","가")} ${rank}등으로 도착하였도다! 남은 이들도 힘을 내거라.`,"happy"); SFX.arrive(); confetti(180);
  }else if(S.fin.length>before&&!(b.res&&b.res.n>=4)&&!S.t.bonus&&!S.t.again){
    S.b={st:"done", msg:(S.t.log?S.t.log+" · ":"")+S.fin.slice(before).map(nm).join(", ")+" 도착!", sticks:b.sticks, tilt:b.tilt};
    setKing("덕분에 함께 도착한 이가 있구나!","happy"); SFX.arrive();
  }else if(b.res&&b.res.n>=4){
    S.b={st:"throw", msg:`${b.res.k}${b.res.k==="윷"?"이":"가"} 나와서 한 번 더 던져요!`, sticks:b.sticks, tilt:b.tilt};
    setKing("한 번 더 던지거라!","wave");
  }else if(S.t.bonus){
    S.t.bonus=false;
    S.b={st:"throw", msg:S.t.bonusMsg||"한 번 더 던져요!", sticks:b.sticks, tilt:b.tilt};
    setKing("한 번 더 던지거라!","wave");
  }else if(S.t.again){
    beginTurn(true); return;
  }else{
    S.b={st:"done", msg:S.t.log||b.msg||"", sticks:b.sticks, tilt:b.tilt};
    setKing(pickOne(["잘 갔도다. 다음 차례를 부르거라.","좋구나! 다음은 누구일꼬?","한 걸음 한 걸음이 중요하니라."]),"idle");
  }
  render();
}
function nextTurn(){
  if(busy||S.phase!=="board"||(S.b.st!=="done"&&S.b.st!=="rest")) return;
  yutAdvance();
}
const yutAllIn = () => ACT().every(x=>S.fin.includes(x));
function yutAdvance(){
  if(yutAllIn()){ endGame(); return; }
  do{ S.ti=(S.ti+1)%N(); }while(S.fin.includes(cur())||!ON(cur()));     // 이미 도착한 사람과 그만둔 사람은 건너뛴다
  beginTurn(false);
}

/* ================= 짝 맞추기 ================= */
function memStart(){
  let kind=KINDS[S.opt.kind]?S.opt.kind:"pic"; const n=S.opt.cards/2;
  const okPairs = kind==="pic" ? PAIRS.filter(p=>picOK(p[0])) : [];
  if(kind==="pic"&&okPairs.length<n) kind="jamo";                       // 그림이 깨지는 기기에서는 자음 카드로 바꾼다
  const src = kind==="opp" ? PAIRS_OPP : kind==="jamo" ? JAMO.slice(0,14) : okPairs;
  const two = kind==="opp" ? (p,k)=>[{k,t:"w",v:p[0],a:p[0]+" ↔ "+p[1]},{k,t:"w",v:p[1],a:p[0]+" ↔ "+p[1]}]
            : kind==="jamo" ? (p,k)=>[{k,t:"j",v:p[0],a:p[0]+" "+p[1]},{k,t:"w",v:p[1],a:p[0]+" "+p[1]}]
            : (p,k)=>[{k,t:"e",v:p[0],a:p[1]},{k,t:"w",v:p[1],a:p[1]}];
  const M=S.mem={cards:shuffle(shuffle(src).slice(0,n).flatMap(two)).map(c=>({...c,up:false,by:-1})), open:[], st:"turn", msg:"", extra:false};
  S.phase="mem";
  if(!S.opt.peek){ memTurn(); return; }
  /* 처음에 모든 카드를 잠깐 보여 준다(카드가 많을수록 조금 더 길게) */
  M.st="peek"; M.cards.forEach(c=>{ c.up=true; }); M.msg="카드를 잘 봐 두세요! 곧 뒤집어요";
  setKing("어디에 무엇이 있는지 잘 보아 두거라.","think"); render();
  setTimeout(()=>{ if(S.mem!==M||S.phase!=="mem"||M.st!=="peek") return; M.cards.forEach(c=>{ c.up=false; }); memTurn(); }, 2500+M.cards.length*200);
}
function memTurn(){
  const M=S.mem; M.st="turn"; M.open=[]; M.extra=false; M.msg="문제를 맞히면 카드 두 장을 뒤집어요";
  setKing(nm(cur())+" 차례로다. 문제를 받거라.","idle"); render();
}
function memAfterQ(ok){
  const M=S.mem; S.phase="mem";
  if(ok){ M.st="flip"; M.msg="카드 두 장을 골라 뒤집어요"; setKing("어느 카드에 무엇이 숨었을꼬?","think"); }

function memCard(i){ const el=$("#mc"+i), c=S.mem.cards[i]; if(el){ el.classList.toggle("up",c.up); el.disabled=c.up; } }
function memBar(){ const el=$("#gbar"); if(el) el.innerHTML=memBarHTML(); renderKing(); }
function memFlip(i){
  const M=S.mem; if(busy||S.phase!=="mem"||!M||M.st!=="flip") return;
  const c=M.cards[i]; if(c.up) return;
  c.up=true; M.open.push(i); SFX.flip(); memCard(i);
  if(M.open.length<2) return;
  busy=true;
  const [ia,ib]=M.open, a=M.cards[ia], b=M.cards[ib];
  setTimeout(()=>{
    if(S.phase!=="mem"||S.mem!==M){ busy=false; return; }
    if(a.k===b.k){
      a.by=b.by=cur(); S.score[cur()]++; M.open=[]; busy=false; SFX.match(); confetti(40);
      if(M.cards.every(x=>x.by>=0)){ M.st="over"; M.msg="카드를 모두 찾았어요!"; setKing("모든 짝을 찾았도다! 참으로 장하구나!","happy"); SFX.arrive(); }

      render();
    }else{
      SFX.miss(); M.msg="짝이 아니에요. 어디 있었는지 잘 기억해 두세요"; setKing("아깝도다! 자리를 잘 보아 두거라.","idle"); memBar();
      setTimeout(()=>{
        if(S.phase!=="mem"||S.mem!==M){ busy=false; return; }
        a.up=b.up=false; memCard(ia); memCard(ib); M.open=[]; busy=false;
        if(S.players[cur()].lv<=2&&!M.extra){          // 씨앗·새싹 단계는 한 차례에 한 번 다시 뒤집는다
          M.extra=true; M.st="flip"; M.msg=`${LV[S.players[cur()].lv].n} 단계는 한 번 더! 다시 두 장을 뒤집어요`; setKing("어린 벗에게는 한 번 더 기회를 주마. 다시 뒤집어 보거라.","wave");
        }else M.st="done";
        setTimeout(render, wait(380));
      }, wait(1500));
    }
  }, wait(650));
}
function memNext(){
  const M=S.mem; if(busy||S.phase!=="mem"||!M) return;
  if(M.st==="over"){ endGame(); return; }

  if(!ACT().length){ endGame(); return; }

/* ================= 우리 집 받아쓰기 ================= */
/* 어른이 문장을 넣으면 기기가 읽어 준다. 아이는 종이에 받아쓰고, 정답을 보며 스스로 채점한다. 화면에 치는 것이 아니라 손으로 쓰는 연습 */
const safeText = v => String(v||"").replace(/<[^>]*>/g,"").replace(/[<>`\\]/g,"").replace(/\s+/g," ").trim().slice(0,40);
const DICTMAX = 20;
function dictOpen(){ S.phase="dict"; S.daily=false; S.cur=null; busy=false; S.dc={st:"edit", msg:""}; setKing("받아쓸 문장을 넣어 보거라. 내가 또박또박 읽어 주마.","wave"); render(); }
function dictAdd(v){ v=safeText(v); if(!v||meta.dict.length>=DICTMAX||meta.dict.includes(v)) return false; meta.dict.push(v); saveMeta(); return true; }
function dictSample(lv){
  const have=new Set(meta.dict), src=shuffle(POOL[lv].filter(q=>q.say).map(q=>safeText(q.say)).filter(t=>t&&!have.has(t))).slice(0,Math.min(5,DICTMAX-meta.dict.length));
  src.forEach(t=>meta.dict.push(t)); saveMeta(); return src.length;
}
function dictStart(items){
  items=(items||meta.dict).slice(); if(!items.length) return;
  S.dc={st:"play", items, i:0, res:[], peek:false}; S.newDeco=[];
  setKing(koVoice?"잘 듣고 종이에 받아쓰거라. 다 썼으면 정답을 보자꾸나.":"어른이 읽어 주는 문장을 종이에 받아쓰거라.","idle"); render(); dictSay(false,450);
}
function dictSay(slow,delay){ const c=S.dc; if(!c||c.st!=="play"||!koVoice) return; const t=c.items[c.i]; setTimeout(()=>{ if(S.phase==="dict"&&S.dc&&S.dc.st==="play"&&S.dc.items[S.dc.i]===t) speak(t,slow?0.55:0.8); },delay||0); }
function dictMark(ok){
  const c=S.dc; if(!c||c.st!=="check") return; c.res[c.i]=ok; c.i++; c.peek=false;
  if(ok){ SFX.right(); } else { SFX.retry(); }
  if(c.i>=c.items.length){ dictEnd(); return; }
  c.st="play"; setKing(ok?"옳거니! 다음 문장이로다.":"괜찮노라. 틀린 곳을 고쳐 쓰고 다음으로 가자꾸나.",ok?"happy":"idle"); render(); dictSay(false,500);
}
function dictEnd(){
  const c=S.dc; c.st="done"; const n=c.res.filter(Boolean).length;
  S.newDeco=withDeco(()=>{ meta.dictDone=(meta.dictDone||0)+1; if(meta.dictDay!==today()){ meta.dictDay=today(); c.gain=gainJamo(1); } });
  setKing(n===c.items.length ? "하나도 틀리지 않았구나! 참으로 장하도다." : "끝까지 해냈구나. 틀린 문장은 한 번 더 써 보거라.","happy"); render(); SFX.end(); confetti(120);
}

    <div class="dictadd"><input class="pname" id="dinput" maxlength="40" autocomplete="off" placeholder="보기: 꽃이 활짝 피었어요." ${full_?"disabled":""}><button class="btn" id="daddBtn" data-act="dadd" ${full_?"disabled":""}>넣기</button></div>
    <div class="qtools"><button id="ds2Btn" data-act="dsample" data-n="2" ${full_?"disabled":""}>새싹 단계 보기 문장 넣기</button><button id="ds3Btn" data-act="dsample" data-n="3" ${full_?"disabled":""}>나무 단계 보기 문장 넣기</button></div>
    ${meta.dict.length ? `<ol class="dictlist">${meta.dict.map((t,i)=>`<li><span class="full">${esc(t)}</span><button class="mini" data-act="ddel" data-n="${i}" aria-label="${i+1}번째 문장 지우기">지우기</button></li>`).join("")}</ol>` : `<p class="dictempty">아직 넣은 문장이 없어요. 학교 받아쓰기 급수표의 문장을 그대로 넣어도 좋아요.</p>`}
    <p class="lvdesc" id="dictmsg">${c.msg||`문장 ${meta.dict.length}개 · ${DICTMAX}개까지 넣을 수 있어요. 문장은 이 기기에만 남아요.`}</p>
    <div class="navrow"><button class="btn" id="dgoBtn" data-act="dgo" ${meta.dict.length?"":"disabled"}>받아쓰기 시작!</button><button class="btn ghost" id="dhomeBtn" data-act="title">처음으로</button></div>`;
}

function endGame(){
  clearInterval(moleTimer);
  S.phase="result"; S.cur=null; busy=false;
  /* 맞힌 문제 다섯 개마다 한글 조각 하나(한 판에 한 개~네 개). ㄱ부터 차례대로 모은다 */
  const total=S.right.reduce((a,b)=>a+b,0);
  const add=total>0 ? Math.max(1,Math.min(4,Math.round(total/5))) : 0;
  const tw=TEAM() ? teamStars()>=teamGoal() : null;
  S.newDeco=withDeco(()=>{ S.gain=gainJamo(add); if(tw===true) meta.teamWins++; });
  const full=S.gain.full;
  S.best=[];
  if(S.mode==="mole"){
    const key="t"+S.opt.turns+S.opt.speed, top=Math.max(...S.score), prev=bag.best[key]||0;
    if(top>prev){ bag.best[key]=top; if(prev>0) S.best=PI().filter(i=>S.score[i]===top); }
  }
  store.set("hq-bag9",bag);
  setKing(full ? "한글 스물넉 자를 모두 모았도다! 참으로 장하구나!" : tw===true ? (N()>1 ? "모두 힘을 모아 해냈도다! 집현전 학사들도 이렇게 힘을 모았느니라." : "목표를 해냈도다! 참으로 장하구나.") : tw===false ? "아깝도다! 조금만 더 하면 되겠구나. 다시 도전해 보거라." : "모두 훌륭하도다! 한글을 아끼고 사랑하는 마음이 으뜸이니라.","smile");
  render(); SFX.end(); confetti(full?400:240);
}

function viewQuestion(){
  const c=S.cur, q=POOL[c.pool][c.qid], daily=!!S.daily, mem=S.mode==="mem"&&!daily, quiz=S.mode==="quiz"&&!daily;
  const done=c.state==="right"||c.state==="wrong", wait_=c.state==="wait";
  const mood=c.state==="right"?"happy":c.state==="wrong"?"sad":wait_?"wait":"think";
  const live=c.order.filter(ci=>!c.off.includes(ci));
  const canChance=!done&&!wait_&&chanceOf(c.pi)>0&&live.length>2, team=TEAM();
  const texts=q.c.map(ctext);
  const kid=c.pool===1&&texts.every(t=>t.length<=4);
  const long=texts.some(t=>t.length>9);
  const pics=q.c.every(x=>typeof x!=="string"&&!x.t);
  const choices=c.order.map(ci=>{
    let cls="choice";
    if(done){ cls += ci===0 ? " right" : (ci===c.picked ? " wrong" : " dim"); }
    else if(c.off.includes(ci)){ cls+=" off"+(shakeIdx===ci?" shake":""); }
    else if(wait_){ cls += ci===c.picked ? " wait" : " dim"; }
    return `<button class="${cls}" id="choice${ci}" data-act="pick" data-i="${ci}" ${done||wait_||c.off.includes(ci)?"disabled":""}>${choiceInner(q.c[ci])}</button>`;
  }).join("");
  let after="";
  if(done){
    const a=q.c[0], atext=(typeof a!=="string"&&a.e?a.e+" ":"")+ctext(a);
    const okMsg = daily ? "잘했어요!" : team ? `${OURS()}이 ${teamStars()}개가 됐어요 ⭐ (목표 ${teamGoal()}개)` : quiz ? `별 하나를 <span class="nw">받았어요 ⭐</span>` : mem ? "카드를 뒤집으러 가요" : "윷을 던지러 가요";
    after = (c.state==="right" ? `<p class="verdict ok">딩동댕! ${okMsg}</p>${c.bonus?`<p class="bonusline">👑 세 문제 연속 정답! 세종대왕 찬스를 하나 받았어요.</p>`:""}` : `<p class="verdict no${ff(atext)}">아쉬워요! 정답은 '${atext}'</p>`)
      + (q.ex?`<p class="ex">${q.ex}</p>`:"")
      + `<button class="btn" id="backBtn" data-act="back">${daily?(S.dy.i<S.dy.qs.length-1?"다음 문제":"도장 받으러 가기"):quiz?"다음으로":c.state==="right"?(mem?"카드 뒤집으러 가기":"윷 던지러 가기"):"돌아가기"}</button>`;
  }
  const tools = done||wait_ ? "" : `<div class="qtools">
      <button id="speakBtn" data-act="speak" ${koVoice?"":"hidden"}>${q.say?"받아쓰기 듣기":"문제 읽어 주기"}</button>
      ${canChance?`<button class="chance" id="chanceBtn" data-act="chance">세종대왕 찬스 쓰기 (${team&&N()>1?"모두 ":""}${chanceOf(c.pi)}개)</button>`:""}
    </div>`;
  return `<div class="qwrap">
    <div class="qside">${full(c.pi,mood)}
      <div class="qinfo"><b>${daily?"오늘의 세 문제":nmH(c.pi)+"의 문제"}</b><span>${LV[c.pool].n} · ${daily?(S.dy.i+1)+" / "+S.dy.qs.length+"번째":quiz?"별 "+S.score[c.pi]+"개":mem?"짝 "+S.score[c.pi]+"쌍":S.pos[c.pi]+"번째 칸"}</span>${S.streak[c.pi]>=2&&c.state!=="wrong"?`<span class="streak">${S.streak[c.pi]}문제 연속 정답</span>`:""}</div>
    </div>
    <div class="qmain">
      ${c.re?`<span class="qtag re">${c.re}</span>`:""}
      ${q.tag?`<span class="qtag">${q.tag}</span>`:""}
      ${q.pic?`<div class="piccard" aria-hidden="true">${q.pic}</div>`:""}
      ${q.art?`<div class="illus">${ILL[q.art]}</div>`:""}
      ${q.big?`<div class="bigtxt${q.big.length>8?" sent":""}${q.say?" full":ff(q.big)}">${q.big}</div>`:""}
      <p class="q${ff(q.q)}">${q.q.replace(/\(\s+\)/g,'<span class="blank"></span>')}</p>
      ${tools}
      <div class="choices${kid?" kid":""}${long?" long":""}${pics?" pics":""}${texts.every(t=>t.length<=5)?" short":""}${ff(...texts)}" data-n="${q.c.length}">${choices}</div>
      ${after}
    </div></div>`;
}
/* ---- 중도 포기 ---- */
/* 차례가 바뀌는 사이(문제를 풀거나 말이 움직이는 중이 아닐 때)에만 뺄 수 있다. 사람을 고르고 한 번 더 눌러야 빠진다 */
function canQuit(){
  if(busy||S.daily||N()<2||!S.out) return false;
  const ph=S.phase;
  if(S.mode==="quiz") return ph==="turn";
  if(S.mode==="yut") return ph==="board"&&["turn","throw","done","rest"].includes(S.b.st);
  if(S.mode==="mem") return ph==="mem"&&!!S.mem&&["turn","done","rest"].includes(S.mem.st);
  if(S.mode==="mole") return ph==="mole"&&!!S.mo&&["ready","sum"].includes(S.mo.st);
  return false;
}
const quitList = () => ACT().filter(x=>!(S.mode==="yut"&&S.fin.includes(x)));
function quitHTML(){
  if(!canQuit()||!quitList().length){ S.quit=null; return ""; }
  if(!S.quit) return `<button class="mini quitbtn" id="quitBtn" data-act="quit">중간에 그만하기</button>`;
  return `<div class="quitbox" role="group" aria-label="중간에 그만하기"><b>누가 그만할까요?</b><div class="quitpick">${quitList().map(i=>
      `<button class="mini qp${S.quit.arm===i?" arm":""}" id="qp-${i}" data-act="quitpick" data-n="${i}">${avatar(i)}<span>${S.quit.arm===i?"정말 그만할까요? 한 번 더":nm(i)}</span></button>`).join("")}</div>
    <small>그만둔 사람은 차례를 건너뛰고, 끝나면 '함께상'을 받아요.</small>
    <button class="mini" id="quitClose" data-act="quit">닫기</button></div>`;
}
function quitPlayer(x){
  if(!canQuit()||!quitList().includes(x)) return;
  S.quit=null; S.out[x]=true; S.outQ[x]=S.asked[x];
  const was=cur()===x, left=ACT();
  SFX.turn();
  if(!left.length){ endGame(); return; }
  setKing(`${J(nm(x),"은","는")} 여기까지로다. 함께해 주어 고마웠노라!`+(left.length===1&&N()>1?` 이제 ${nm(left[0])} 혼자 끝까지 가 보거라.`:""),"wave");
  if(S.mode==="yut"){
    if(yutAllIn()){ S.b={st:"done", msg:"모두 도착했어요"}; render(); return; }
    if(was){ S.b={st:"done"}; yutAdvance(); return; }
    render(); return;
  }
  if(!was){ render(); return; }
  if(S.mode==="quiz"){ quizNext(); return; }
  if(S.mode==="mem"){ memAdvance(); return; }
  if(S.mode==="mole"){ moleAdvance(); return; }
  render();
}
/* ---- 상장 ---- */
function ranking(){
  const gone=PI().filter(x=>!ON(x)&&!(S.mode==="yut"&&S.fin.includes(x))).map(pi=>({pi,lv:-1}));     // 중간에 그만둔 사람은 맨 뒤에 '함께상'
  if(S.mode==="yut") return S.fin.concat(ACT().filter(x=>!S.fin.includes(x)).sort((a,b)=>S.pos[b]-S.pos[a])).map((pi,lv)=>({pi,lv})).concat(gone);
  const lvls=[...new Set(ACT().map(i=>S.score[i]))].sort((a,b)=>b-a);
  return ACT().sort((a,b)=>S.score[b]-S.score[a]).map(pi=>({pi,lv:lvls.indexOf(S.score[pi])})).concat(gone);
}

      ${S.mode==="mole"?"":`<p class="sub">틀린 문제는 다음 판에 하나씩 다시 나와요.</p>`}</details>`

  else if(act==="dlv"){ if(S.dy&&LV[+n]){ S.dy.lv=+n; render(); } }
  else if(act==="dstart"){ if(S.phase==="daily"&&S.dy&&S.dy.st==="pick") dailyStart(); }
  else if(act==="dcopy"){ const t=shareText(), msg=$("#dsharemsg"), ok=()=>{ if(msg) msg.textContent="복사했어요! 가족 대화방에 붙여 보세요."; }, no=()=>{ if(msg) msg.textContent="위 글을 길게 눌러 복사해 주세요."; };
    try{ navigator.clipboard.writeText(t).then(ok,no); }catch(err){ no(); } }
  else if(act==="dict"){ dictOpen(); }
  else if(act==="dadd"){ const el=$("#dinput"), v=el?el.value:""; if(!safeText(v)) S.dc.msg="받아쓸 문장을 먼저 써 주세요."; else S.dc.msg = dictAdd(v) ? "" : meta.dict.includes(safeText(v)) ? "이미 넣은 문장이에요." : `문장은 ${DICTMAX}개까지 넣을 수 있어요.`; render(); const e2=$("#dinput"); if(e2&&!e2.disabled) try{ e2.focus(); }catch(err){} }
  else if(act==="ddel"){ meta.dict.splice(+n,1); saveMeta(); S.dc.msg=""; render(); }
  else if(act==="dsample"){ const k=dictSample(+n===3?3:2); S.dc.msg=k?`보기 문장 ${k}개를 넣었어요. 필요 없는 것은 지워도 돼요.`:"더 넣을 보기 문장이 없어요."; render(); }
  else if(act==="dgo"){ dictStart(); }
  else if(act==="dsay"){ dictSay(false); }
  else if(act==="dslow"){ dictSay(true); }
  else if(act==="dpeek"){ if(S.dc){ S.dc.peek=!S.dc.peek; render(); } }
  else if(act==="dshow"){ if(S.dc&&S.dc.st==="play"){ try{ speechSynthesis.cancel(); }catch(err){} S.dc.st="check"; setKing("종이에 쓴 것과 똑같은지 찬찬히 견주어 보거라.","think"); render(); } }
  else if(act==="dok"){ dictMark(true); }
  else if(act==="dno"){ dictMark(false); }
  else if(act==="dagain"){ const c=S.dc; if(c&&c.st==="done") dictStart(c.items.filter((_,i)=>!c.res[i])); }
  else if(act==="jamo"){                                   // 한글 조각을 누르면 소리가 나고 이름을 알려 준다
    const k=+n, [ch,name]=JAMO[k]||[], cap=$("#bagcap"); if(!ch) return;
    sfx((t,d)=>INS.bell(d,[67,69,71,74,76,79,81,83,86,88,91,93][k%12],t,.4,.22));
    if(cap) cap.textContent = k<bag.got ? `${ch} · ${name}` : `${ch} · ${name} (아직 못 모았어요)`;
    b.classList.remove("ping"); void b.offsetWidth; b.classList.add("ping");
  }
  else if(act==="speed"){ if(SPEED[n]) S.opt.speed=n; saveSetup(); render(); }
  else if(act==="turns"){ if([1,2,3].includes(+n)) S.opt.turns=+n; saveSetup(); render(); }
  else if(act==="players"){ goPlayers(); }
  else if(act==="pedit"){ S.edit=+n; render(); }
  else if(act==="pcount"){ setCount(+n); saveSetup(); render(); }
  else if(act==="panimal"){ if(!p.name||p.name===AN[p.animal].n) p.name=AN[n].n; p.animal=n; saveSetup(); render(); }
  else if(act==="pg"){ p.g=n; saveSetup(); render(); }
  else if(act==="page"){ p.age=n; saveSetup(); render(); }
  else if(act==="plv"){ p.lv=+n; saveSetup(); render(); }
  else if(act==="start"){ startGame(); }
  else if(act==="launch"){ if(S.order.length===N()) launch(); }
  else if(act==="tut"){ startTut(); }
  else if(act==="fs"){ toggleFull(); }
  else if(act==="tprev"){ tutGo(-1); }
  else if(act==="tnext"){ tutGo(1); }
  else if(act==="tspeak"){ const t=TUT[S.ts]; speak(t.t+". "+(t.how?Object.keys(MODES).map(k=>MODES[k].n+". "+MODES[k].d).join(" "):tbody(t))); }
  else if(act==="ppick"){ pracPick(+b.dataset.i); }
  else if(act==="pnext"){ pracNext(); }
  else if(act==="draw"){ drawLot(+b.dataset.p); }
  else if(act==="ask"){ showQuestion(); }
  else if(act==="pick"){ answer(+b.dataset.i); }
  else if(act==="chance"){ useChance(); }
  else if(act==="back"){ afterQuestion(); }
  else if(act==="throw"){ throwYut(); }
  else if(act==="keyok"){ keyApply(); }
  else if(act==="mdone"){ missionEnd(true); }
  else if(act==="mskip"){ missionEnd(false); }
  else if(act==="nextturn"){ nextTurn(); }
  else if(act==="mflip"){ memFlip(+b.dataset.i); }
  else if(act==="mnext"){ memNext(); }
  else if(act==="mgo"){ moleGo(); }
  else if(act==="mhit"){ moleHit(+b.dataset.i); }
  else if(act==="mnext2"){ moleNext(); }
  else if(act==="quit"){ if(canQuit()){ S.quit=S.quit?null:{arm:-1}; renderHUD(); } }
  else if(act==="quitpick"){ const x=+n; if(!S.quit||!canQuit()) return; if(S.quit.arm!==x||performance.now()-S.quit.t<500){ S.quit.arm=x; S.quit.t=performance.now(); renderHUD(); } else quitPlayer(x); }
  else if(act==="speak"){ const c=S.cur; if(c){ const q=POOL[c.pool][c.qid]; speak(q.say||q.q); } }
  else if(act==="mspeak"){ const M=S.mo; if(M&&M.task) speak(M.task.rule+". "+M.task.tip); }
  else if(act==="sound"){ S.sound=!S.sound; store.set("hq-sfx2",S.sound); render(); if(S.sound) SFX.turn(); }
  else if(act==="music"){ S.music=!S.music; store.set("hq-bgm2",S.music); if(!S.music) musicStop(.3); render(); }
  else if(act==="home"){
    if(busy) return;
    if(!homeArmed){ homeArmed=true; b.textContent="그만할까요? 한 번 더 누르기"; setTimeout(()=>{ if(homeArmed){homeArmed=false; b.textContent="처음으로";} },3000); }
    else{ homeArmed=false; b.textContent="처음으로"; toTitle(); }
  }
});
/* 이름은 치는 대로 바로 반영한다(화면을 다시 그리면 글자판이 닫히므로 그 자리만 고친다) */
document.addEventListener("input",e=>{
  if(e.target.id!=="pname"||S.phase!=="players") return;
  const i=Math.min(S.edit,N()-1), v=safeName(e.target.value);
  if(v!==e.target.value) e.target.value=v;                 // 화면을 깨뜨릴 수 있는 기호는 이름에 넣지 않는다
  S.players[i].name=v; saveSetup();
  const t=$("#ptabname-"+i); if(t) t.textContent=v.trim()||AN[S.players[i].animal].n;
});
/* 자판: 1~4로 답 고르기, Enter로 다음 */
document.addEventListener("keydown",e=>{
  if(e.target.id==="dinput"&&e.key==="Enter"){ e.preventDefault(); const b=$("#daddBtn"); if(b) b.click(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.tagName==="INPUT") return;
  if(S.phase==="q"&&S.cur&&S.cur.state==="open"&&/^[1-4]$/.test(e.key)){
    const ci=S.cur.order[+e.key-1]; if(ci!==undefined) answer(ci); return;
  }
  if(S.phase==="prac"&&S.prac&&!S.prac.done&&/^[1-4]$/.test(e.key)){
    const ci=S.prac.order[+e.key-1]; if(ci!==undefined) pracPick(ci); return;
  }
  if(e.key==="Enter"){
    if(document.activeElement&&document.activeElement.tagName==="BUTTON") return;
    const b=document.querySelector("#stage .btn:not(.ghost):not([disabled])"); if(b){ e.preventDefault(); b.click(); }
  }
});

/* ================= 화면에 꽉 차게 ================= */
/* 태블릿이나 큰 화면에서는 가운데에만 작게 보이지 않도록, 화면 크기에 맞춰 놀이판 전체를 키운다 */
const ZOOM_OK = !!(window.CSS && CSS.supports && CSS.supports("zoom","1.5"));
function fit(){
  const app=$(".app"), W=window.innerWidth, H=window.innerHeight;
  let B=800, k=1;
  if(W>=700){
    if(W>H) B=Math.min(1500,Math.max(800,W));   // 가로로 긴 화면은 놀이판을 넓게 쓴다
    k=Math.min(Math.max(1,W/B),4);              // 줄이지는 않는다(줄이면 그림이 덜 또렷해 보인다). 아주 큰 화면에서만 키운다
  }
  if(Math.abs(k-1)<.03) k=1;
  app.style.maxWidth = Math.round(ZOOM_OK ? B : B*Math.max(1,k))+"px";
  app.style.zoom = (ZOOM_OK && k!==1) ? k.toFixed(3) : "";
  app.style.setProperty("--vh", Math.round(H/((ZOOM_OK&&k!==1)?k:1))+"px");   // 놀이판 기준으로 본 화면 높이
  $("#ver").textContent = "19판";
}
window.addEventListener("resize",fit);
function toggleFull(){
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else { const r=document.documentElement.requestFullscreen(); if(r&&r.catch) r.catch(()=>{}); }
  }catch(e){}
}
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent=document.fullscreenElement?"작게 보기":"크게 보기"; fit(); });

/* ================= 시작 ================= */
/* 브라우저의 '강제 다크 모드'가 밝은 화면을 제멋대로 어둡게 칠하면 색이 탁해진다.
   그런 브라우저에서는 이 놀이판의 어두운 테마를 직접 켠다. */
let FORCED_DARK=false;
function useOwnDarkIfForced(){
  try{
    const d=document.createElement("div");
    d.style.cssText="display:none;background-color:canvas;color-scheme:light";
    document.body.appendChild(d);
    const forced=getComputedStyle(d).backgroundColor!=="rgb(255, 255, 255)";
    d.remove();
    FORCED_DARK=forced;
    if(forced) document.documentElement.dataset.theme="dark";
  }catch(e){}
}
function validPlayers(a,min){ return Array.isArray(a)&&a.length>=(min==null?1:min)&&a.length<=MAXP&&a.every(p=>p&&AN[p.animal]&&(p.g==="f"||p.g==="m")&&(p.age==="kid"||p.age==="adult")&&LV[p.lv]&&typeof p.name==="string"); }
const cleanP = p => ({name:safeName(p.name),animal:p.animal,g:p.g,age:p.age,lv:p.lv,
  hat:HATS[p.hat]&&decoOK("hat",p.hat)?p.hat:"", prop:PROPS[p.prop]&&decoOK("prop",p.prop)?p.prop:"", wear:SPECIALWEAR[p.wear]&&decoOK("wear",p.wear)?p.wear:""});
function boot(data){
  useOwnDarkIfForced();
  $("#roof").innerHTML=roofSVG();
  $("#fsBtn").hidden=!document.fullscreenEnabled;
  S.sound=store.get("hq-sfx2",true)!==false; S.music=store.get("hq-bgm2",true)!==false;
  const setup=store.get("hq-setup9",null);
  if(setup&&validPlayers(setup.players)){
    S.players=setup.players.map(cleanP);
    if(validPlayers(setup.bench,0)) S.bench=setup.bench.map(cleanP);
    if(MODES[setup.mode]) S.mode=setup.mode;
    const o=setup.opt||{};
    if([LAP/2,LAP,LAP*2].includes(o.len)) S.opt.len=o.len;
    if([12,16,20].includes(o.cards)) S.opt.cards=o.cards;
    if(SPEED[o.speed]) S.opt.speed=o.speed;
    if([1,2,3].includes(o.turns)) S.opt.turns=o.turns;
    if(KINDS[o.kind]) S.opt.kind=o.kind;
    if(typeof o.peek==="boolean") S.opt.peek=o.peek;
    if([5,7,10].includes(o.qn)) S.opt.qn=o.qn;
    S.opt.catchOn=!!o.catchOn; S.opt.team=!!o.team;
  }
  let ok=false;
  try{
    if(data && data.v===14 && data.phase && data.phase!=="title" && validPlayers(data.players)){
      const keepSnd={sound:S.sound,music:S.music};
      Object.assign(S,data,keepSnd);
      const n=N();
      if(!validPlayers(S.bench,0)) S.bench=[];
      if(!Array.isArray(S.mq)) S.mq=[];
      if(!S.qq||typeof S.qq!=="object") S.qq={};
      S.players=S.players.map(cleanP); S.bench=S.bench.map(cleanP);
      if(!Array.isArray(S.miss)||S.miss.length!==n) S.miss=PI().map(()=>[]);
      if(!Array.isArray(S.out)||S.out.length!==n) S.out=PI().map(()=>false); else S.out=S.out.map(Boolean);
      if(!Array.isArray(S.outQ)||S.outQ.length!==n) S.outQ=PI().map(()=>0); S.quit=null;
      if(!S.re||typeof S.re!=="object") S.re={};
      if(!S.review||typeof S.review!=="object") S.review={};
      if(!Array.isArray(S.best)) S.best=[];
      if(!KINDS[S.opt.kind]) S.opt.kind="pic";
      if(typeof S.opt.peek!=="boolean") S.opt.peek=true;
      if(![5,7,10].includes(S.opt.qn)) S.opt.qn=5;
      ok = MODES[S.mode] && Array.isArray(S.order) && (S.order.length===n || ["mode","players","order","tut","prac","daily","dict","rec"].includes(S.phase))
        && (!S.cur || !!(POOL[S.cur.pool]&&POOL[S.cur.pool][S.cur.qid]))
        && (S.phase!=="q" || !!S.cur) && (S.phase!=="mem" || !!S.mem) && (S.phase!=="turn" || !!S.qz) && (S.mode!=="quiz" || S.phase!=="q" || !!S.qz || !!S.daily) && (S.phase!=="daily" || !!(S.dy&&LV[S.dy.lv])) && (S.phase!=="dict" || !!(S.dc&&(S.dc.st==="edit"||Array.isArray(S.dc.items)))) && (!S.daily || !!(S.dy&&Array.isArray(S.dy.qs))) && (S.phase!=="mole" || !!(S.mo&&S.mo.task&&Array.isArray(S.mo.task.items)))
        && (S.phase!=="tut" || !!TUT[S.ts]) && (S.phase!=="prac" || !!(S.prac&&PRAC[S.prac.i]));
      if(ok&&S.cur&&S.cur.state==="wait"){ S.cur.state="open"; S.cur.picked=null; }
      if(ok&&S.phase==="board"&&(S.b.st==="toss"||S.b.st==="move")){ S.b={st:"done", msg:"", sticks:S.b.sticks, tilt:S.b.tilt}; }
      if(ok&&S.phase==="mem"){ S.mem.cards.forEach(c=>{ if(c.by<0) c.up=false; }); S.mem.open=[]; if(S.mem.st==="flip") S.mem.st="done"; if(S.mem.st==="peek") S.mem.st="turn"; }
      if(ok&&S.phase==="mole"&&S.mo.st==="play") S.mo.st="ready";          // 하던 차례는 처음부터 다시
      if(!SPEED[S.opt.speed]) S.opt.speed="slow"; if(![1,2,3].includes(S.opt.turns)) S.opt.turns=2;
      if(ok&&S.phase==="result"&&!S.gain) S.gain={from:bag.got,to:bag.got,full:false};
    }
  }catch(e){ ok=false; }
  fit();
  if(ok) render(); else { S.order=[]; toTitle(); }
}
try{ window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify(S))); }catch(e){}
boot({});
if(parent!==window&&parent.schoolName){
 S.players=DEFAULT_PLAYERS.slice(0,2).map((p,i)=>{const id=i===0?'p1':'p2',cfg=parent.schoolExplorer?.(id)||{},animal=({bunny:'rabbit',dino:'tiger',bear:'bear',cat:'cat',fox:'fox',panda:'panda'})[cfg.suit];return {...p,name:parent.schoolName(id),animal:AN[animal]?animal:p.animal,age:'kid',lv:S.players[i]?.lv||1};});
 S.sound=true;S.music=false;S.phase='title';render();
 window.schoolSetGuide=v=>{S.sound=Boolean(v);};
}

</script>
