<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>놀이온 특별편 · 한글 윷놀이 잔치</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
body{margin:0}
/* 배치: 색동 띠 → 차례·점수 → 놀이판(윷놀이 말판 · 짝 맞추기 카드 · 두더지 밭) 또는 문제 카드 → 맨 아래 세종대왕님과 말풍선
   흐름: 첫 화면 → (한글날 이야기 → 몸풀기 퀴즈) → 놀이 고르기 → 캐릭터 만들기 → 차례 뽑기 → 놀이 → 상장 */
:root{
  --bg:#DCEFEA; --paper:#FFFDF6; --paper2:#F1F8F5;
  --ink:#1E2A4A; --ink-soft:#55628C; --line:#BFD9D2; --edge:#1E2A4A;
  --red:#E5483F; --yellow:#FFC531; --blue:#2F6FDE; --green:#1C8F5C; --pink:#F27BA5;
  --on-accent:#FFFFFF; --on-yellow:#1E2A4A; --tint:#FFF1C2;
  --roof:#3B4670; --roof2:#262E50;
  --font-display:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A33; --paper:#1C2748; --paper2:#243159;
    --ink:#F4F1E4; --ink-soft:#AAB5DA; --line:#35426E; --edge:#C9D2F2;
    --red:#FF6F64; --yellow:#FFD257; --blue:#7FACFF; --green:#4FCB91; --pink:#FF94B8;
    --on-accent:#10172E; --on-yellow:#1E2A4A; --tint:#3A3F63;
    --roof:#55639A; --roof2:#3A4675;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A33; --paper:#1C2748; --paper2:#243159;
  --ink:#F4F1E4; --ink-soft:#AAB5DA; --line:#35426E; --edge:#C9D2F2;
  --red:#FF6F64; --yellow:#FFD257; --blue:#7FACFF; --green:#4FCB91; --pink:#FF94B8;
  --on-accent:#10172E; --on-yellow:#1E2A4A; --tint:#3A3F63;
  --roof:#55639A; --roof2:#3A4675;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:17px; line-height:1.55;
  display:flex; flex-direction:column;
  word-break:keep-all; overflow-wrap:anywhere;
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:4px solid var(--blue); outline-offset:3px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}

.saekdong{
  flex:none; height:14px;
  background:repeating-linear-gradient(90deg,
    var(--red) 0 30px, var(--yellow) 30px 60px, var(--blue) 60px 90px,
    var(--green) 90px 120px, var(--pink) 120px 150px, var(--paper) 150px 180px);
}
.jamo{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0}
.jamo span{position:absolute; font-family:var(--font-display); color:var(--line); opacity:.55; line-height:1; animation:drift 7s ease-in-out infinite alternate}
.jamo span:nth-child(2n){animation-duration:9s; animation-delay:-3s}
.jamo span:nth-child(3n){animation-duration:11s; animation-delay:-5s}
@keyframes drift{from{translate:0 -10px} to{translate:0 12px}}

.app{
  position:relative; z-index:1; flex:1;
  width:100%; max-width:800px; margin-inline:auto;
  padding-inline:16px; padding-block:10px 16px;
  display:flex; flex-direction:column; gap:10px;
}
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.brand{font-family:var(--font-display); font-size:1.15rem; color:var(--ink-soft)}
.tools{display:flex; gap:8px; flex-wrap:wrap}
.mini{background:var(--paper); border:2px solid var(--line); border-radius:999px; padding:.3em .9em; font-size:.9rem; color:var(--ink-soft)}
.ver{font-size:.7rem; color:var(--ink-soft); text-align:right}

/* 점수판 · 글자판 */
.hud{display:flex; flex-direction:column; gap:8px}
.scores{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.chip{display:flex; align-items:center; gap:8px; min-width:0; background:var(--paper); border:2px solid var(--line); border-radius:999px; padding:5px 12px 5px 5px}
.chip svg{width:36px; height:36px; flex:none}
.chip b{font-family:var(--font-display); font-weight:400; font-size:1.05rem; min-width:0; white-space:nowrap}
.chip i{font-style:normal; margin-left:auto; font-family:var(--font-display); font-variant-numeric:tabular-nums; white-space:nowrap}

.chip.on{border-color:var(--edge); background:var(--tint)}
.boardrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.blabel{font-family:var(--font-display); font-size:.95rem; color:var(--ink-soft)}
.board{display:flex; gap:4px; flex-wrap:wrap}
.tile{
  width:1.75em; height:1.75em; display:grid; place-items:center;
  font-family:var(--font-display); font-size:1.05rem; line-height:1;
  border-radius:8px; border:2px dashed var(--line); color:var(--ink-soft); background:var(--paper);
}
.tile.on{border:2px solid var(--edge); color:var(--on-accent)}
.tile.c0{background:var(--red)} .tile.c1{background:var(--yellow); color:var(--on-yellow)} .tile.c2{background:var(--blue)}
.tile.c3{background:var(--green)} .tile.c4{background:var(--pink); color:var(--on-yellow)}
.tile.new{animation:flip .7s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(1.6)} 60%{transform:rotateY(0) scale(1.6)} 100%{transform:none}}

/* 기와지붕 + 문제 카드 */
.hall{flex:1; display:flex; flex-direction:column}
#roof{position:relative; padding-top:18px}
.roof{display:block; width:100%; height:clamp(34px,8.7vw,70px); margin-bottom:-3px; position:relative; z-index:1}
.magwrap{position:absolute; right:22%; top:2px; width:40px; height:auto; z-index:2; overflow:visible}
.magpie{animation:peck 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:30% 100%}
@keyframes peck{0%,70%,100%{transform:none} 78%{transform:rotate(14deg)} 86%{transform:none} 92%{transform:rotate(14deg)}}
.stage{
  flex:1; background:var(--paper); border:3px solid var(--edge); border-radius:6px 6px 28px 28px;
  box-shadow:0 7px 0 var(--edge);
  padding:clamp(16px,3.6vw,28px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  text-align:center;
}
.stage.pop>*{animation:pop .3s ease-out backwards}
@keyframes pop{from{transform:translateY(8px) scale(.98)} to{transform:none}}

.eyebrow{font-family:var(--font-display); color:var(--red); font-size:1.05rem; letter-spacing:.04em}
.goldtag{display:inline-block; background:var(--yellow); color:var(--on-yellow); border:2px solid var(--edge); border-radius:999px; padding:0 .7em; margin-left:.4em; animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.07)}}
h1{font-family:var(--font-display); font-weight:400; font-size:clamp(2.2rem,9vw,3.6rem); line-height:1.1; margin:0; text-wrap:balance}
h1 em{font-style:normal; color:var(--blue)}
h2{font-family:var(--font-display); font-weight:400; font-size:clamp(1.6rem,6vw,2.3rem); line-height:1.2; margin:0; text-wrap:balance}
h3{font-family:var(--font-display); font-weight:400; margin:0}
.sub{color:var(--ink-soft); margin:0; max-width:34em}

/* 캐릭터 공통 */
.ch{display:block; height:auto; overflow:visible; animation:bob 1.5s ease-in-out infinite alternate}
.ch-r{--k:.9} .ch-j{--k:.78; animation-delay:-.5s} .ch-m{--k:1; animation-delay:-.9s} .ch-k{--k:1}
.ol{stroke:#33405F; stroke-width:1.8; stroke-linejoin:round}
@keyframes bob{to{transform:translateY(-3px)}}
.eye-h,.eye-s,.mo-h,.mo-s{display:none}
:is([data-mood=happy],[data-mood=wave],[data-mood=dance],[data-mood=smile]) :is(.eye-n,.mo-n){display:none}
:is([data-mood=happy],[data-mood=wave],[data-mood=dance],[data-mood=smile]) :is(.eye-h,.mo-h){display:inline}
[data-mood=sad] :is(.eye-n,.mo-n){display:none}
[data-mood=sad] :is(.eye-s,.mo-s){display:inline}
.eye-n{transform-box:fill-box; transform-origin:center; animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:none} 97%{transform:scaleY(.1)}}
.tear{animation:tear 1.2s ease-in infinite}
@keyframes tear{from{transform:none; opacity:1} to{transform:translateY(12px); opacity:0}}
.arm{transform-box:fill-box; transform-origin:50% 10%}
.armL{transform:rotate(14deg)} .armR{transform:rotate(-14deg)}
.ch-k .armL{transform:rotate(4deg)} .ch-k .armR{transform:rotate(-4deg)}
:is([data-mood=wave],[data-mood=happy],[data-mood=dance]) .armR{animation:waveR .42s ease-in-out infinite alternate}
:is([data-mood=happy],[data-mood=dance]) .armL{animation:waveL .42s ease-in-out infinite alternate}
.ch-k:is([data-mood=happy],[data-mood=dance]) .armL{animation:none}
@keyframes waveR{from{transform:rotate(-132deg)} to{transform:rotate(-166deg)}}
@keyframes waveL{from{transform:rotate(132deg)} to{transform:rotate(166deg)}}
[data-mood=think] .armR{transform:rotate(-158deg)}
.ch-k[data-mood=think] .armR{transform:rotate(-4deg)}
[data-mood=sad] .armL{transform:rotate(3deg)} [data-mood=sad] .armR{transform:rotate(-3deg)}
.head{transform-box:fill-box; transform-origin:50% 88%}
:is([data-mood=think],[data-mood=wait]) .head{animation:tilt 1.5s ease-in-out infinite alternate}
[data-mood=dance] .head{animation:tilt .5s ease-in-out infinite alternate}
[data-mood=sad] .head{transform:rotate(-8deg) translateY(2px)}
@keyframes tilt{from{transform:rotate(-6deg)} to{transform:rotate(6deg)}}
.ch[data-mood=happy]{animation:jump .42s ease-out infinite alternate}
@keyframes jump{from{transform:translateY(0) scaleY(.96)} to{transform:translateY(-16px) scaleY(1.03)}}
.ch[data-mood=dance]{animation:sway .5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)} to{transform:rotate(5deg)}}
.ch[data-mood=sad]{animation:none}
.ch[data-mood=wait]{animation:jitter .1s linear infinite alternate}
@keyframes jitter{from{transform:translateX(-1.5px)} to{transform:translateX(1.5px)}}
/* 캐릭터마다 다른 버릇 */
.ear{transform-box:fill-box; transform-origin:50% 100%}
.ch-m .earL{animation:earwig 2.6s ease-in-out infinite}
.ch-m .earR{animation:earwig 2.6s ease-in-out -.3s infinite}
@keyframes earwig{0%,70%,100%{transform:none} 80%{transform:rotate(-12deg)} 90%{transform:rotate(8deg)}}
.tail{transform-box:fill-box; transform-origin:0% 100%; animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)} to{transform:rotate(16deg)}}
.flower{transform-box:fill-box; transform-origin:center; animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ch-r .earL{animation:flick 3.4s ease-in-out infinite}
.ch-r .earR{animation:flick 3.4s ease-in-out -1.3s infinite}
.tailL{transform-origin:100% 100%; animation:swish 1.4s ease-in-out infinite alternate}
@keyframes swish{from{transform:rotate(-8deg)} to{transform:rotate(12deg)}}
@keyframes flick{0%,84%,100%{transform:none} 90%{transform:rotate(-14deg)} 95%{transform:rotate(6deg)}}
.wing{transform-box:fill-box; transform-origin:50% 100%}
.ch-k:is([data-mood=happy],[data-mood=wave]) .wing{animation:earwig .6s ease-in-out infinite}
.ch-k.talk .mo-n,.ch-k.talk .mo-h{transform-box:fill-box; transform-origin:50% 0; animation:talk .2s ease-in-out 7 alternate}
@keyframes talk{to{transform:scaleY(2.1)}}

/* 첫 화면: 일월오봉도 앞의 세종대왕님과 세 사람 */
.scene{position:relative; width:100%; max-width:600px; aspect-ratio:16/7; min-height:230px; border-radius:20px; overflow:hidden; border:3px solid var(--edge)}
.scene>svg.bg{position:absolute; inset:0; width:100%; height:100%}
.kingpos{position:absolute; left:50%; bottom:18%; height:76%; translate:-50% 0}
.kingpos .ch{height:100%; width:auto}
.troupe{position:absolute; left:0; right:0; bottom:6px; height:62%; display:flex; justify-content:space-around; align-items:flex-end}
.tp{height:100%; max-width:30%; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:flex-end}
.tp .ch{height:calc((100% - 20px) * var(--k)); width:auto; flex:none}
.tp b{margin-top:-8px; position:relative; z-index:1; background:var(--paper); color:var(--ink); border:2px solid var(--edge); border-radius:999px; padding:0 .7em; font-family:var(--font-display); font-weight:400; font-size:.95rem; line-height:1.5; white-space:nowrap}
.startrow{display:flex; flex-wrap:wrap; gap:14px 28px; justify-content:center; align-items:center}
.seg{display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap}
.seg span{font-family:var(--font-display); color:var(--ink-soft)}
.seg button{font-family:var(--font-display); font-size:1.1rem; padding:.3em 1em; border-radius:999px; background:var(--paper2); border:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue); color:var(--on-accent); border-color:var(--edge)}
.rules{margin:0; padding:10px 16px 10px 34px; text-align:left; background:var(--paper2); border-radius:16px; max-width:36em; font-size:.95rem}
.rules li+li{margin-top:2px}
/* 한글날 이야기 · 몸풀기 퀴즈 */
.tpic{display:flex; align-items:flex-end; justify-content:center; gap:clamp(8px,3vw,24px)}
.tpic .ch{width:calc(clamp(60px,16vw,92px) * var(--k)); flex:none}
.illus{color:var(--ink)}
.illus.big{width:clamp(130px,34vw,180px)}
.tbody{margin:0; max-width:30em; font-size:clamp(1.05rem,3.4vw,1.2rem); line-height:1.65; text-wrap:pretty}
.dots{display:flex; gap:6px; align-items:center}
.dots i{width:10px; height:10px; border-radius:5px; background:var(--line)}
.dots i.on{width:24px; background:var(--red)}
.navrow{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center}

.btn{
  font-family:var(--font-display); font-size:clamp(1.3rem,5vw,1.6rem);
  padding:.5em 1.5em; border-radius:999px;
  background:var(--yellow); color:var(--on-yellow);
  border:3px solid var(--edge); box-shadow:0 5px 0 var(--edge);
}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.7; cursor:default}
.btn.ghost{background:var(--paper2); color:var(--ink); font-size:1.1rem; box-shadow:0 4px 0 var(--edge)}
.btn.ghost:disabled{opacity:.35}

/* 제비뽑기 */
.lineup{display:flex; gap:clamp(8px,4vw,40px); align-items:flex-end; justify-content:center}
.pk{display:flex; flex-direction:column; align-items:center; gap:2px; transition:transform .1s}
.pk .ch{width:calc(clamp(80px,23vw,124px) * var(--k))}
.pk .spot{width:86%; height:12px; border-radius:50%; background:var(--line); margin-top:-4px}
.pk b{font-family:var(--font-display); font-weight:400; font-size:1.2rem}
.pk small{color:var(--ink-soft); font-size:.85rem}
.pk.done{opacity:.38}
.pk.lit{transform:translateY(-12px) scale(1.12)}
.pk.lit .spot{background:var(--yellow)}
.hero{animation:walkin .8s cubic-bezier(.2,.9,.3,1.2)}
.hero .ch{width:calc(clamp(130px,36vw,176px) * var(--k))}
@keyframes walkin{0%{transform:translateX(-60vw) rotate(-10deg)} 60%{transform:translateX(10px) rotate(4deg)} 100%{transform:none}}

/* 문제 */
.qwrap{display:grid; grid-template-columns:auto minmax(0,1fr); gap:20px; align-items:center; width:100%}
.qside{display:flex; flex-direction:column; align-items:center; gap:8px; width:150px}
.qside .ch{width:calc(134px * var(--k))}
.qinfo{display:flex; flex-direction:column; align-items:center; font-family:var(--font-display); line-height:1.3}
.qinfo b{font-weight:400; font-size:1.2rem}
.qinfo span{color:var(--ink-soft); font-size:.95rem}
.qinfo .streak{color:var(--red)}
.qmain{display:flex; flex-direction:column; align-items:center; gap:12px; min-width:0}
.piccard{font-size:clamp(3.6rem,15vw,5.4rem); line-height:1.1; background:var(--paper2); border:3px solid var(--edge); border-radius:20px; padding:4px 24px; transform:rotate(-2deg)}
.illus{width:clamp(110px,28vw,150px)}
.illus svg{display:block; width:100%; height:auto}
.bigtxt{font-family:var(--font-display); font-size:clamp(2rem,8.5vw,3.3rem); line-height:1.15; color:var(--blue); letter-spacing:.06em}
.q{font-family:var(--font-display); font-size:clamp(1.35rem,4.6vw,1.8rem); line-height:1.3; margin:0; text-wrap:balance; max-width:22em}
.blank{display:inline-block; width:2.6em; height:1em; margin-inline:.2em; border-bottom:4px solid var(--blue); vertical-align:baseline}
.qtools{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.qtools button{background:var(--paper2); border:2px solid var(--line); border-radius:999px; padding:.3em 1em; font-size:.95rem}
.qtools .chance{background:var(--tint); border-color:var(--edge); font-family:var(--font-display)}

.choices{display:grid; gap:12px; width:100%}
.choices[data-n="3"]{grid-template-columns:repeat(3,1fr)}
.choices[data-n="2"],.choices[data-n="4"]{grid-template-columns:repeat(2,1fr)}
.choices.long[data-n]{grid-template-columns:1fr}
.choice{
  min-width:0; min-height:62px;
  font-family:var(--font-display); font-size:1.25rem; line-height:1.25;
  padding:.55em .7em; border-radius:20px;
  background:var(--paper2); color:var(--ink);
  border:3px solid var(--edge); box-shadow:0 5px 0 var(--edge);
}
.choice:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 var(--edge)}
.kid .choice{font-size:clamp(1.8rem,5.4vw,2.4rem); padding:.4em .3em}
.choice .ce{display:block; font-size:1.9em; line-height:1.15}
.kid .choice .ce{font-size:1.35em}
.choice svg{display:block; width:64px; height:auto; margin:0 auto 2px}
.choice:disabled{cursor:default}
.choice.off{opacity:.3}
.choice.dim{opacity:.5}
.choice.wait{background:var(--yellow); color:var(--on-yellow); animation:pulse .28s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.04)}}
.choice.right{background:var(--green); color:var(--on-accent)}
.choice.right::after{content:" ○"}
.choice.wrong{background:var(--red); color:var(--on-accent)}
.choice.wrong::after{content:" ✕"}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}

.verdict{font-family:var(--font-display); font-size:1.5rem; margin:0; line-height:1.3}
.verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
.gain{display:inline-block; color:var(--yellow); -webkit-text-stroke:1px var(--edge); font-size:1.5em; animation:starpop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.gain:nth-child(2){animation-delay:.15s} .gain:nth-child(3){animation-delay:.3s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)} to{transform:none}}
.gnote{display:block; font-size:1rem; color:var(--ink-soft)}
.ex{background:var(--tint); border-radius:16px; padding:10px 16px; margin:0; max-width:32em; text-align:left}
.banner{font-family:var(--font-display); font-size:1.2rem; background:var(--yellow); color:var(--on-yellow); border:3px solid var(--edge); border-radius:16px; padding:8px 16px; margin:0}

/* 상장 */
.certs{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; width:100%}
.cert{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--paper2); border:3px solid var(--edge); border-radius:14px; padding:12px 14px 14px;
  outline:2px solid var(--yellow); outline-offset:-9px;
}
.cert.best{background:var(--tint)}
.certch{height:118px; display:flex; align-items:flex-end}
.certch .ch{width:calc(84px * var(--k))}
.certhead{font-family:var(--font-display); letter-spacing:.5em; padding-left:.5em; color:var(--ink-soft)}
.cert h3{font-size:1.5rem; color:var(--red); line-height:1.2}
.certname{font-family:var(--font-display); font-size:1.3rem}
.cert p{margin:0; font-size:.9rem; line-height:1.45}
.certstars{font-family:var(--font-display); font-size:1.15rem}
.certsign{display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--ink-soft); text-align:right; line-height:1.3}
.certsign svg{width:34px; height:34px}
.treasure{display:flex; align-items:center; gap:14px; text-align:left; background:var(--paper2); border:2px solid var(--line); border-radius:20px; padding:10px 16px; width:100%; max-width:560px}
.treasure.open{border-color:var(--edge); background:var(--tint)}
.treasure svg{width:92px; flex:none}
.treasure b{font-family:var(--font-display); font-weight:400; font-size:1.2rem}
.treasure p{margin:2px 0 0; font-size:.95rem}
.treasure .phrase{font-family:var(--font-display); color:var(--blue); font-size:1.15rem}

/* 세종대왕님 말풍선 */
.king{display:flex; align-items:flex-end; gap:14px}
#kingArt .ch{width:clamp(78px,19vw,104px)}
.bubble{
  position:relative; flex:1; min-width:0;
  background:var(--paper); border:3px solid var(--edge); border-radius:22px;
  padding:10px 16px; margin-bottom:22px;
  font-family:var(--font-display); font-size:clamp(1.05rem,3.6vw,1.25rem); line-height:1.35;
}
.bubble::before{
  content:""; position:absolute; left:-11px; bottom:18px; width:16px; height:16px;
  background:var(--paper); border-left:3px solid var(--edge); border-bottom:3px solid var(--edge);
  transform:rotate(45deg);
}
.bubble.up{flex:none; margin:4px 0 0; background:var(--tint); max-width:30em}
.bubble.up::before{left:calc(50% - 8px); bottom:auto; top:-11px; background:var(--tint); transform:rotate(135deg)}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5}

@media (max-width:640px){
  .choices[data-n]{grid-template-columns:1fr}
  .choices.pics[data-n]{grid-template-columns:repeat(3,1fr)}
  .scores{gap:6px}
  .chip{gap:5px; padding:4px 8px 4px 4px}
  .chip svg{width:26px; height:26px}
  .chip b,.chip i{font-size:.95rem}
  .qwrap{grid-template-columns:1fr; gap:10px}
  .qside{flex-direction:row; width:auto; justify-content:center; gap:14px}
  .qside .ch{width:calc(82px * var(--k))}
  .qinfo{align-items:flex-start}
  .treasure svg{width:70px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}

/* ================= 윷놀이 말판 ================= */
.chip i{font-size:.95rem}
.stage.board{padding:clamp(10px,2.4vw,18px); gap:8px; border-radius:24px}
.bwrap{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%}
.bd{position:relative; width:min(100%,600px,62vh); aspect-ratio:1; container-type:inline-size; flex:none}
.cell{position:absolute; width:10%; height:10%; padding:1.5px}
.cell>div{
  width:100%; height:100%; border-radius:18%; display:grid; place-items:center; line-height:1;
  background:var(--paper2); border:2px solid var(--line);
  font-family:var(--font-display); color:var(--ink-soft); font-size:11px; font-size:2.7cqw;
}
.cell .ic{font-size:17px; font-size:4.5cqw}
.cell .ic2{font-size:12px; font-size:3.1cqw; letter-spacing:-.12em}
.cell.t-jump>div{background:var(--paper); border-color:var(--blue); box-shadow:inset 0 0 0 2px var(--blue)}
.cell.t-again>div{background:var(--paper); border-color:var(--green); box-shadow:inset 0 0 0 2px var(--green)}
.cell.t-mission>div{background:var(--paper); border-color:var(--pink); box-shadow:inset 0 0 0 2px var(--pink)}
.cell.t-chance>div{background:var(--paper); border-color:var(--yellow); box-shadow:inset 0 0 0 2px var(--yellow)}
.cell.t-slip>div{background:var(--paper); border-color:var(--red); box-shadow:inset 0 0 0 2px var(--red)}
.cell.t-key>div{background:var(--tint); border-color:var(--edge); box-shadow:inset 0 0 0 3px var(--yellow)}
.cell.t-start>div,.cell.fin>div{background:var(--tint); border-color:var(--edge)}
.cell.off>div{opacity:.3}
.tok{
  position:absolute; width:7.2%; aspect-ratio:1; translate:-50% -50%; z-index:2;
  border-radius:50%; box-shadow:0 0 0 2px var(--edge);
  transition:left .22s ease, top .22s ease;
}
.tok svg{display:block; width:100%; height:100%}
.tok.on{z-index:3; box-shadow:0 0 0 2px var(--edge), 0 0 0 4px var(--yellow); animation:tokhop .45s ease-in-out infinite alternate}
@keyframes tokhop{to{transform:translateY(-12%)}}
.bdc{
  position:absolute; left:10%; top:10%; width:80%; height:80%; padding:3%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; gap:2.4cqw; text-align:center;
}
.bwho{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:18px; font-size:5.2cqw; line-height:1.1}
.bwho svg{width:36px; width:9.5cqw; height:auto; flex:none}
.bmsg{margin:0; font-family:var(--font-display); font-size:16px; font-size:4.6cqw; line-height:1.25; text-wrap:balance}
.bres{margin:0; font-family:var(--font-display); font-size:24px; font-size:7.2cqw; line-height:1.15; color:var(--red); text-wrap:balance}
.bsub{margin:0; font-size:13px; font-size:3.4cqw; line-height:1.3; color:var(--ink-soft)}
.bd .btn{font-size:18px; font-size:5.2cqw; padding:.38em 1.1em}
.bd .btn.ghost{font-size:14px; font-size:3.8cqw}
.bd .navrow{gap:8px; gap:2.4cqw}
.mcard{
  font-family:var(--font-display); font-size:16px; font-size:4.6cqw; line-height:1.3; text-wrap:balance;
  background:var(--tint); border:2px solid var(--edge); border-radius:14px; padding:.5em .8em;
}
.yut{display:flex; justify-content:center; align-items:center; gap:10px; gap:3.4cqw; height:70px; height:19cqw}
.stick{
  height:100%; aspect-ratio:1/4.2; border-radius:999px; border:2px solid var(--edge);
  display:flex; flex-direction:column; justify-content:space-evenly; align-items:center;
  font-family:var(--font-body); font-style:normal; font-size:10px; font-size:2.8cqw; line-height:1; color:#F6DFAE;
}
.stick i{font-style:normal}
.stick.flat{background:#F6DFAE}
.stick.back{background:linear-gradient(90deg,#8A5628,#BE8748 45%,#8A5628)}
.stick.spin{background:linear-gradient(90deg,#BE8748 50%,#F6DFAE 50%)}
.yut.toss .stick{animation:toss .85s cubic-bezier(.3,.6,.4,1) both}
.yut.toss .stick:nth-child(2){animation-delay:.05s} .yut.toss .stick:nth-child(3){animation-delay:.1s} .yut.toss .stick:nth-child(4){animation-delay:.15s}
@keyframes toss{0%{transform:translateY(0) rotate(0)} 45%{transform:translateY(-75%) rotate(560deg)} 100%{transform:translateY(0) rotate(1080deg)}}
.legend{display:flex; flex-wrap:wrap; gap:2px 14px; justify-content:center; font-size:.85rem; color:var(--ink-soft); margin:0; padding:0; list-style:none}
.bside{display:none; flex-direction:column; align-items:center; gap:8px; width:230px; flex:none}
.bside .ch{width:calc(140px * var(--k))}
.bside b{font-family:var(--font-display); font-weight:400; font-size:1.3rem}
.bside .legend{flex-direction:column; align-items:flex-start; font-size:.95rem; gap:4px}
.king.compact #kingArt .ch{width:clamp(56px,13vw,72px)}
.king.compact .bubble{margin-bottom:12px; padding:6px 14px; font-size:clamp(.95rem,3.2vw,1.1rem)}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .bwrap{flex-direction:row; justify-content:center; gap:32px}
  .bd{width:min(560px,62vh)}
  .bside{display:flex}
  .bwrap>.legend{display:none}
}
@media (max-width:640px){
  .chip{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:6px; border-radius:16px; padding:4px 8px 4px 4px}
  .chip svg{grid-row:span 2; align-self:center}
  .chip b{line-height:1.2}
  .chip i{margin-left:0; font-size:.8rem; line-height:1.2}
}
/* 차례 뽑기 · 받아쓰기 */
.rank3{display:flex; gap:clamp(10px,4vw,36px); align-items:flex-end; justify-content:center}
.rank3 .pk .ch{width:calc(clamp(64px,18vw,104px) * var(--k))}
.rank3 .no{font-family:var(--font-display); background:var(--yellow); color:var(--on-yellow); border:2px solid var(--edge); border-radius:999px; padding:0 .7em; font-size:.95rem}
.qtag{font-family:var(--font-display); background:var(--blue); color:var(--on-accent); border-radius:999px; padding:.1em .9em; font-size:1rem}
.bigtxt.sent{font-size:clamp(1.25rem,4.6vw,1.9rem); letter-spacing:0; line-height:1.3; text-wrap:balance}
.certstat{font-size:.85rem; color:var(--ink-soft)}
@media (prefers-reduced-motion: reduce){
  .tok,.tok.on,.yut.toss .stick{animation:none!important; transition:none!important}
}
.stick .dot{width:46%; aspect-ratio:1; border-radius:50%; background:#D8362F}
.mcard.gold{background:var(--yellow); color:var(--on-yellow)}
.qtag.gold{background:var(--yellow); color:var(--on-yellow); border:2px solid var(--edge); animation:glow 1s ease-in-out infinite alternate}
.btn.draw{font-size:1rem; padding:.3em .9em; box-shadow:0 3px 0 var(--edge)}
.rank3 .no{line-height:1.9}

/* 브라우저가 밝은 화면을 제멋대로 어둡게 바꾸면(강제 다크 모드) 색이 탁해진다. 밝은 테마일 때는 그 변환을 받지 않겠다고 알린다 */
:root{color-scheme:only light}
.ver{position:absolute; right:16px; bottom:1px}
/* 가로로 넓고 낮은 화면(태블릿 브라우저): 한 화면 높이에 다 들어오게 줄인다. --vh는 fit()이 넣어 주는 화면 높이 */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .app{gap:8px}
  #roof{padding-top:12px}
  .roof{height:clamp(30px, calc(var(--vh,800px) * .07), 70px)}
  .magwrap{top:-5px}
  body:not([data-ph="title"]):not([data-ph="result"]) #roof{display:none}
  body:not([data-ph="title"]):not([data-ph="result"]) .stage{border-radius:24px}
  .stage{padding-block:14px; gap:10px}
  h1{font-size:min(3.6rem, calc(var(--vh,800px) * .075))}
  .scene{max-width:min(600px, max(260px, calc((var(--vh,800px) - 458px) * 16 / 7))); min-height:0}
  .bd{width:min(560px, max(300px, calc(var(--vh,800px) - 292px)))}
  .rank3 .pk .ch{width:calc(min(104px, var(--vh,800px) * .11) * var(--k))}
}
.fdnote{margin:0; font-size:.85rem; color:var(--ink-soft); max-width:40em}

/* ================= 캐릭터 고르기 · 세 가지 놀이 ================= */
:root{--purple:#8E6CE0; --orange:#F08A3C}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--purple:#B39CFF; --orange:#FFA869} }
:root[data-theme="dark"]{--purple:#B39CFF; --orange:#FFA869}
/* 그림 카드: 기울이지 않고, 그림이 칸 밖으로 나가지 않게 넉넉한 네모 칸 한가운데에 둔다 */
.piccard{
  transform:none; padding:0; width:1.9em; height:1.6em; line-height:1; flex:none;
  display:grid; place-items:center; overflow:hidden; white-space:nowrap;
}
.piccard.sm{padding:0}
.choice .ce{line-height:1.25; white-space:nowrap}
.choice .ce.two{font-size:1.5em}
.kid .choice .ce.two{font-size:1.1em}
.sign .ce.two{font-size:1.15em; white-space:nowrap}
.scores{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.troupe[data-n="4"] .tp{max-width:24%}
.troupe[data-n="5"] .tp{max-width:19.5%}
.troupe[data-n="5"] .tp b{font-size:.8rem; padding:0 .5em}
.rank3{flex-wrap:wrap; row-gap:10px}
.tp:nth-child(2) .ch,.pk:nth-child(2) .ch{animation-delay:-.5s}
.tp:nth-child(3) .ch,.pk:nth-child(3) .ch{animation-delay:-.9s}
.tp:nth-child(4) .ch,.pk:nth-child(4) .ch{animation-delay:-.3s}
/* 동물마다 다른 귀 버릇 */
.ch-rabbit .earL{animation:earwig 2.6s ease-in-out infinite}
.ch-rabbit .earR{animation:earwig 2.6s ease-in-out -.3s infinite}
:is(.ch-cat,.ch-fox,.ch-tiger,.ch-bear,.ch-panda,.ch-pig,.ch-monkey) .earL{animation:flick 3.4s ease-in-out infinite}
:is(.ch-cat,.ch-fox,.ch-tiger,.ch-bear,.ch-panda,.ch-pig,.ch-monkey) .earR{animation:flick 3.4s ease-in-out -1.3s infinite}
.ch-dog .ear{transform-origin:50% 0%}
.ch-dog .earL{animation:flop 2.8s ease-in-out infinite}
.ch-dog .earR{animation:flop 2.8s ease-in-out -.4s infinite reverse}
@keyframes flop{0%,76%,100%{transform:none} 84%{transform:rotate(10deg)} 92%{transform:rotate(-6deg)}}

/* 놀이 고르기 */
.modes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; width:100%; max-width:980px}
.modecard{
  display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0;
  padding:12px 10px 14px; border-radius:22px; text-align:center;
  background:var(--paper2); border:3px solid var(--line);
}
.modecard svg{display:block; width:min(70%,150px); height:auto; flex:none}
.modecard[aria-pressed="true"]{background:var(--tint); border-color:var(--edge); box-shadow:0 5px 0 var(--edge); transform:translateY(-3px)}
.mtxt{display:flex; flex-direction:column; gap:2px; min-width:0}
.mtxt .tag{font-family:var(--font-display); font-size:.85rem; color:var(--red)}
.mtxt b{font-family:var(--font-display); font-weight:400; font-size:clamp(1.3rem,3.4vw,1.6rem); line-height:1.15}
.mtxt small{font-size:.9rem; line-height:1.4; color:var(--ink-soft)}
.opts{display:flex; flex-direction:column; gap:8px; align-items:center}

/* 캐릭터 만들기 */
.ptabs{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.ptab{
  display:flex; align-items:center; gap:6px; font-family:var(--font-display); font-size:1.05rem;
  background:var(--paper2); border:2px solid var(--line); border-radius:999px; padding:4px 14px 4px 4px;
}
.ptab svg{width:34px; height:34px; flex:none}
.ptab[aria-pressed="true"]{background:var(--tint); border-color:var(--edge); box-shadow:0 3px 0 var(--edge)}
.phead{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 24px}
.pedit{display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:center; width:100%; max-width:860px}
.pprev{display:flex; flex-direction:column; align-items:center; gap:6px; width:160px}
.pprev .ch{width:calc(132px * var(--k))}
.lvtag{font-family:var(--font-display); font-size:.9rem; background:var(--blue); color:var(--on-accent); border-radius:999px; padding:.05em .8em; white-space:nowrap}
.pform{display:flex; flex-direction:column; gap:10px; min-width:0}
.prow{display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap}
.prow label{font-family:var(--font-display); color:var(--ink-soft)}
.pname{
  font:inherit; font-family:var(--font-display); font-size:1.3rem; line-height:1.3; color:var(--ink);
  width:8.5em; min-width:0; padding:.2em .7em; border-radius:14px; border:3px solid var(--edge); background:var(--paper);
}
.pname:focus-visible{outline:4px solid var(--blue); outline-offset:2px}
.pform .seg{justify-content:flex-start}
.prow .seg{flex-wrap:nowrap}
.lvseg button{display:flex; flex-direction:column; align-items:center; line-height:1.15; padding:.3em .8em; border-radius:16px}
.lvseg b{font-weight:400}
.lvseg small{font-family:var(--font-body); font-size:.78rem; opacity:.9; white-space:nowrap}
.lvdesc{margin:0; text-align:left; font-size:.9rem; color:var(--ink-soft)}
.agrid{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px}
.abtn{padding:3px; border-radius:50%; border:3px solid transparent; background:none; aspect-ratio:1; max-width:76px; width:100%; justify-self:center}
.abtn svg{display:block; width:100%; height:100%; border-radius:50%}
.abtn[aria-pressed="true"]{border-color:var(--edge); box-shadow:0 0 0 3px var(--yellow)}

/* 놀이 화면 위쪽 줄: 누구 차례인지, 무엇을 할지 */
.gbar{display:flex; align-items:center; justify-content:center; gap:6px 16px; flex-wrap:wrap; width:100%; min-height:48px}
.bwho2{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:1.25rem; line-height:1.1}
.bwho2 svg{width:38px; height:38px; flex:none}
.gmsg{margin:0; font-family:var(--font-display); font-size:1.1rem; line-height:1.25; color:var(--ink-soft); text-wrap:balance}
.gbar .btn{font-size:1.2rem; padding:.3em 1.1em; box-shadow:0 4px 0 var(--edge)}

/* 짝 맞추기 */
.memgrid{--c:4; --r:4}
.memgrid[data-n="12"]{--c:4; --r:3}
.memgrid[data-n="20"]{--c:5; --r:4}
.memgrid{
  --u:calc(100cqw / var(--c));
  --w:calc((var(--vh,800px) - 350px) * var(--c) * 5 / (var(--r) * 6));
  width:min(100%, 600px, max(250px, var(--w))); aspect-ratio:calc(var(--c) * 5) / calc(var(--r) * 6);
  display:grid; grid-template-columns:repeat(var(--c),1fr); grid-template-rows:repeat(var(--r),1fr); gap:6px;
  container-type:inline-size; flex:none;
}
.mcard2{padding:0; border:0; background:none; perspective:700px; min-width:0; min-height:0; cursor:default}
.mcard2 .in{display:block; position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .38s ease}
.mcard2.up .in{transform:rotateY(180deg)}
.fa{
  position:absolute; inset:0; display:grid; place-items:center; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border:3px solid var(--edge); border-radius:14px; line-height:1.1;
}
.fa.bk{
  background:var(--blue) repeating-linear-gradient(45deg, transparent 0 9px, rgba(255,255,255,.13) 9px 18px);
  color:var(--yellow); font-family:var(--font-display); font-size:22px; font-size:calc(var(--u) * .36); box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);
}
.fa.fr{background:var(--paper); color:var(--ink); transform:rotateY(180deg)}
.fa.fr.e{font-size:34px; font-size:calc(var(--u) * .5)}
.fa.fr.w{font-family:var(--font-display); font-size:20px; font-size:calc(var(--u) * .36); color:var(--blue); white-space:nowrap}
.fa.fr.w.long{font-size:16px; font-size:calc(var(--u) * .25)}
.mcard2.got .fa.fr{background:var(--own); background:color-mix(in srgb, var(--own) 34%, var(--paper)); box-shadow:inset 0 0 0 3px var(--own)}
.memgrid.can .mcard2:not(.up){cursor:pointer}
.memgrid.can .mcard2:not(.up) .fa.bk{animation:cardglow 1s ease-in-out infinite alternate}
@keyframes cardglow{to{box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), 0 0 0 3px var(--yellow)}}
.memgrid.can .mcard2:not(.up):active .in{transform:scale(.94)}

/* 두더지 잡기 */
.mwrap{display:flex; flex-direction:column; align-items:center; gap:8px; width:100%}
.mleft{display:contents}
.mprompt{display:flex; flex-direction:column; align-items:center; gap:6px; order:1}
.mprompt .q{font-size:clamp(1.15rem,4vw,1.5rem)}
.mprompt .bigtxt{font-size:clamp(1.6rem,7vw,2.6rem)}
.mprompt .bigtxt.sent{font-size:clamp(1.1rem,4.2vw,1.6rem)}
.illus.sm{width:clamp(76px,16vw,104px)}
.piccard.sm{font-size:clamp(2.4rem,10vw,3.4rem); padding:0 16px; border-radius:16px}
.mtimer{order:2; width:min(100%,460px); height:14px; border-radius:7px; background:var(--paper2); border:2px solid var(--edge); overflow:hidden; flex:none}
.mtimer.off{visibility:hidden}
#mtime{display:block; width:100%; height:100%; background:var(--green); transform-origin:0 50%}
#mtime.low{background:var(--red)}
.field{
  order:3; width:min(100%, 560px, max(250px, calc((var(--vh,800px) - 480px) * 1.5)));
  display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:8px;
  background:#BFE5B5; border:3px solid var(--edge); border-radius:22px; flex:none;
}
:root[data-theme="dark"] .field{background:#2E5A45}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .field{background:#2E5A45} }
.mwrap .verdict{order:4; font-size:1.3rem}
.hole{position:relative; aspect-ratio:1/1; overflow:hidden; border-radius:16px; container-type:inline-size}
.hole::before{content:""; position:absolute; left:12%; right:12%; bottom:5%; height:20%; border-radius:50%; background:#2B1D12}
.hole::after{content:""; position:absolute; left:6%; right:6%; bottom:-11%; height:25%; border-radius:50%; background:#7A5230; border:3px solid #1E2A4A; z-index:2; pointer-events:none}
.mole{
  position:absolute; left:0; right:0; top:0; bottom:9%; padding:0; border:0; background:none; z-index:1;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  transition:transform .4s cubic-bezier(.3,1.5,.5,1);
}
.mole.pre{transform:translateY(112%)}
.mole.pre.up{transform:none}
.hole:nth-child(2) .mole{transition-delay:.08s} .hole:nth-child(3) .mole{transition-delay:.16s}
.hole:nth-child(4) .mole{transition-delay:.12s} .hole:nth-child(5) .mole{transition-delay:.04s} .hole:nth-child(6) .mole{transition-delay:.2s}
.mole>svg{display:block; width:58%; width:58cqw; height:auto; flex:none}
.sign{
  position:relative; z-index:1; max-width:96%; margin-bottom:-4%;
  background:var(--paper); color:var(--ink); border:3px solid var(--edge); border-radius:12px; box-shadow:0 3px 0 var(--edge);
  padding:.1em .5em; font-family:var(--font-display); line-height:1.2; font-size:17px; font-size:clamp(14px,11.5cqw,24px);
}
.sign.kid{font-size:26px; font-size:clamp(20px,19cqw,40px)}
.sign.kid.k4{font-size:22px; font-size:clamp(18px,14cqw,30px)}
.sign .ce{display:block; font-size:1.5em; line-height:1.1}
.sign svg{display:block; width:44px; height:auto; margin:0 auto}
.m-dizzy{display:none}
.mole.hit .m-eye{display:none} .mole.hit .m-dizzy{display:inline}
.mole.hit>svg{animation:squish .5s ease-out both; transform-origin:50% 100%}
@keyframes squish{0%{transform:none} 25%{transform:scale(1.2,.6)} 60%{transform:scale(.92,1.08)} 100%{transform:scale(1.06,.9)}}
.mole.ok .sign{background:var(--green); color:var(--on-accent)}
.mole.no .sign{background:var(--red); color:var(--on-accent)}
.mole.no>svg{animation:teehee .22s ease-in-out infinite alternate; transform-origin:50% 100%}
@keyframes teehee{from{transform:rotate(-5deg)} to{transform:rotate(5deg) translateY(-3%)}}
.mole:not(:disabled){cursor:pointer}
.mole:not(:disabled):active .sign{transform:translateY(2px); box-shadow:0 1px 0 var(--edge)}
/* 보기가 긴 문제: 구멍을 넓게 두 줄로 */
.field.long{display:flex; flex-wrap:wrap; justify-content:center}
.field.long .hole{width:calc(50% - 3px); aspect-ratio:3/2}
.field.long .hole:empty{display:none}
.field.long .mole>svg{width:42%; width:42cqw}
.field.long .hole::after{height:20%; bottom:-10%}
.field.long .sign{font-size:15px; font-size:clamp(14px,8.4cqw,22px); line-height:1.2; padding:.15em .45em}

@media (min-width:900px) and (min-aspect-ratio:5/4){
  .modecard{flex-direction:row; text-align:left; gap:14px; padding:14px 16px}
  .modecard svg{width:110px}
  .pedit{gap:28px; max-width:1040px}
  .pprev .ch{width:calc(min(150px, var(--vh,800px) * .2) * var(--k))}
  .agrid{grid-template-columns:repeat(12,minmax(0,1fr))}
  .abtn{max-width:68px}
  body[data-ph="players"] .stage{gap:8px}

  .memgrid,.memgrid[data-n="16"]{--c:8; --r:2}
  .memgrid[data-n="12"]{--c:6; --r:2}
  .memgrid[data-n="20"]{--c:10; --r:2}
  .memgrid{--w:calc((var(--vh,800px) - 340px) * var(--c) * 5 / (var(--r) * 6)); width:min(100%, max(250px, var(--w))); gap:10px}
  .choices.long[data-n="3"]{grid-template-columns:repeat(3,1fr)}
  .choices.long[data-n="2"],.choices.long[data-n="4"]{grid-template-columns:repeat(2,1fr)}
  .qmain .illus{width:min(150px, calc(var(--vh,800px) * .15))}
  .qmain .piccard{font-size:min(5.4rem, calc(var(--vh,800px) * .1))}
  .mwrap{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:28px}
  .mleft{display:flex; flex-direction:column; align-items:center; gap:12px; min-width:0}
  .mprompt .q{font-size:clamp(1.3rem,2.4vw,1.8rem)}
  .mprompt .bigtxt{font-size:clamp(2rem,4vw,3rem)}
  .mprompt .bigtxt.sent{font-size:clamp(1.25rem,2.2vw,1.8rem)}
  .field{width:min(600px, max(300px, calc((var(--vh,800px) - 356px) * 1.5)))}
  .hero .ch{width:calc(min(176px, var(--vh,800px) * .2) * var(--k))}
  .mwrap .verdict{font-size:1.5rem}
}
@media (max-width:640px){
  .modes{grid-template-columns:1fr; gap:8px}
  .modecard{flex-direction:row; text-align:left; gap:12px; padding:8px 12px}
  .modecard svg{width:78px}
  .mtxt small{font-size:.85rem}
  .scores[style*="--n:5"],.scores[style*="--n: 5"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  .phead{gap:6px 16px}
  .lvseg button{padding:.3em .55em}
  .lvseg small{font-size:.66rem}
  .pedit{gap:10px}
  .pprev{width:118px}
  .pprev .ch{width:calc(100px * var(--k))}
  .lvtag{font-size:.8rem; white-space:normal; text-align:center; line-height:1.3; padding:.15em .7em}
  .seg button{font-size:1rem; padding:.3em .8em}
  .bwho2{font-size:1.1rem} .bwho2 svg{width:32px; height:32px}
  .gmsg{font-size:1rem}
  .memgrid{gap:5px}

}

  .pform .seg{justify-content:center}
  .prow{justify-content:center}

}
/* 좁은 화면이라도 보기가 짧으면 옆으로 나란히 놓아 화면이 길어지지 않게 한다 */
@media (min-width:480px) and (max-width:640px){
  .choices.short[data-n="3"]{grid-template-columns:repeat(3,1fr)}
  .choices.short[data-n="2"],.choices.short[data-n="4"]{grid-template-columns:repeat(2,1fr)}
  .choices.short.kid .choice{font-size:clamp(1.5rem,5vw,2rem)}
}

  .choices.short[data-n="2"],.choices.short[data-n="4"]{grid-template-columns:repeat(2,1fr)}
  .choices.short:not(.kid)[data-n="3"]{grid-template-columns:repeat(3,1fr)}
  .choices.short:not(.kid) .choice{font-size:1.1rem; padding:.5em .3em}
}

/* ================= 첫 화면 · 한글 조각 · 틀린 문제 다시 보기 ================= */
.thero,.tleft{display:contents}
.tleft>.eyebrow{order:1} .tleft>.logo{order:2} .thero>.scene{order:3} .tleft>.bagrow{order:4} .tleft>.navrow{order:5} .tleft>.fdnote{order:6}
/* 제목: 글자 하나하나를 색동 빛깔 조각에 담는다 */
.logo{display:flex; justify-content:center; gap:.1em; line-height:1; padding-bottom:.1em}
.lt{
  display:grid; place-items:center; width:1.25em; height:1.25em; flex:none;
  border:3px solid var(--edge); border-radius:.3em; box-shadow:0 .09em 0 var(--edge);
  background:var(--red); color:#FFFFFF; animation:ltin .5s cubic-bezier(.3,1.5,.5,1) backwards, lthop 3.6s ease-in-out 1.2s infinite;
}
.lt.gap{margin-left:.22em}
.lt.c1,.jt.on.c1,.lamp.c1{background:var(--yellow); color:var(--on-yellow)}
.lt.c2,.jt.on.c2,.lamp.c2{background:var(--blue); color:var(--on-accent)}
.lt.c3,.jt.on.c3,.lamp.c3{background:var(--green); color:var(--on-accent)}
.lt.c4,.jt.on.c4,.lamp.c4{background:var(--pink); color:var(--on-yellow)}
.lt.c5,.jt.on.c5,.lamp.c5{background:var(--purple); color:var(--on-accent)}
.lt.c0,.jt.on.c0,.lamp.c0{background:var(--red); color:var(--on-accent)}
.lt:nth-child(2n){animation-delay:.1s,1.5s} .lt:nth-child(3n){animation-delay:.2s,1.9s}
@keyframes ltin{from{transform:translateY(-60%) scale(.4) rotate(-20deg); opacity:0} to{transform:none; opacity:1}}
@keyframes lthop{0%,86%,100%{transform:none} 92%{transform:translateY(-14%)}}
/* 일월오봉도 앞에 모인 세종대왕님과 열두 동물, 하늘에 뜬 한글 등 */
.scene.big{max-width:660px; aspect-ratio:16/7.4; container-type:inline-size; --hb:46%; --hf:43%}
body[data-ph="title"] .stage{gap:10px}
.scene.big .kingpos{bottom:20%; height:74%; z-index:1}
.crowd{position:absolute; inset:0}
.tc{position:absolute; display:flex; align-items:flex-end; height:var(--hb); bottom:15%; translate:-50% 0; z-index:0}
.tc .ch{height:calc(100% * var(--k)); width:auto; flex:none}
.tc0{left:7%} .tc1{left:20%} .tc2{left:33%} .tc3{left:67%} .tc4{left:80%} .tc5{left:93%}
.tc6,.tc7,.tc8,.tc9,.tc10,.tc11{height:var(--hf); bottom:2%; z-index:2}
.tc6{left:9%} .tc7{left:23%} .tc8{left:37%} .tc9{left:63%} .tc10{left:77%} .tc11{left:91%}
.tc:nth-child(2n) .ch{animation-delay:-.4s} .tc:nth-child(3n) .ch{animation-delay:-.8s} .tc:nth-child(5n) .ch{animation-delay:-.2s}
.lamps{position:absolute; inset:0; pointer-events:none}
.lamp{
  position:absolute; translate:-50% 0; width:9%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
  font-family:var(--font-display); font-size:16px; font-size:5.2cqw; line-height:1;
  border:2px solid #1E2A4A; box-shadow:0 0 0 3px rgba(255,255,255,.22); animation:lampfloat 5s ease-in-out infinite alternate;
}
.lamp::after{content:""; position:absolute; left:50%; top:100%; width:2px; height:38%; background:rgba(255,255,255,.55)}
@keyframes lampfloat{from{transform:translateY(-8%) rotate(-4deg)} to{transform:translateY(10%) rotate(4deg)}}
/* 한글 조각 스물넉 자 */
.bagrow{display:flex; flex-direction:column; align-items:center; gap:4px; width:100%}
.jstrip{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; width:100%; max-width:520px}
.jt{
  flex:none; width:calc((100% - 52px) / 14); max-width:34px; aspect-ratio:1; padding:0; display:grid; place-items:center;
  font-family:var(--font-display); font-size:clamp(.8rem,3.4vw,1.15rem); line-height:1;
  border-radius:26%; border:2px dashed var(--line); background:var(--paper2); color:var(--line);
}
.jt.on{border:2px solid var(--edge); box-shadow:0 2px 0 var(--edge)}
.jbr{flex-basis:100%; height:0}
.jt.new{animation:jtnew .7s cubic-bezier(.3,1.6,.5,1) backwards}
.jt.new:nth-child(n){animation-delay:.5s}
.jt.ping{animation:jtping .35s ease-out}
@keyframes jtnew{from{transform:scale(0) rotate(-180deg)} to{transform:none}}
@keyframes jtping{40%{transform:translateY(-22%) scale(1.15)}}
.bagcap{margin:0; font-size:.9rem; color:var(--ink-soft); min-height:1.5em}
.bagbox{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; max-width:640px; background:var(--paper2); border:2px solid var(--line); border-radius:18px; padding:10px 14px}
.bagbox b{font-family:var(--font-display); font-weight:400; font-size:1.15rem; text-wrap:balance}
/* 상장의 정답 별, 단계 권하기 */
.accstar{color:var(--yellow); -webkit-text-stroke:.6px var(--edge); letter-spacing:.05em}
.accstar i{font-style:normal; color:var(--line); -webkit-text-stroke:0}
.certtip{font-size:.82rem; line-height:1.35; background:var(--paper); border:2px dashed var(--blue); border-radius:10px; padding:2px 8px; text-wrap:balance}
/* 틀린 문제 다시 보기 */
.note{width:100%; max-width:760px; text-align:left; background:var(--paper2); border:2px solid var(--line); border-radius:18px; padding:8px 14px}
.note summary{font-family:var(--font-display); font-size:1.15rem; cursor:pointer; padding:2px 0}
.notep{margin-top:8px}
.notep ol{margin:4px 0 0; padding-left:1.4em; display:flex; flex-direction:column; gap:6px}
.notep li{font-size:.95rem; line-height:1.45}
.nq{display:block} .nq b{color:var(--blue); font-family:var(--font-display); font-weight:400}
.na{display:block; font-family:var(--font-display); color:var(--green)}
.notep small{display:block; color:var(--ink-soft); font-size:.88rem}
.note .sub{margin-top:8px; font-size:.9rem}
.qtag.re{background:var(--purple)}
/* 짝 맞추기: 낱자 카드 · 두더지 잡기: 황금 두더지, 틀렸을 때 풀이 */
.fa.fr.j{font-family:var(--font-display); font-size:34px; font-size:calc(var(--u) * .56); color:var(--red)}
.field.gold{background:#FFE38A; box-shadow:0 0 0 4px var(--yellow)}
:root[data-theme="dark"] .field.gold{background:#8A6A1F}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .field.gold{background:#8A6A1F} }
.mwrap .ex{order:5; font-size:.95rem}
.mwrap .btn{order:6; font-size:1.2rem; padding:.3em 1.2em}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .thero{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:clamp(20px,3vw,44px); align-items:center; width:100%}
  .tleft{display:flex; flex-direction:column; align-items:center; gap:clamp(10px, calc(var(--vh,800px) * .024), 20px); min-width:0}
  .scene.big{max-width:none; width:100%; aspect-ratio:auto; height:min(calc(var(--vh,800px) - 200px), 46vw); min-height:0; --hb:39%; --hf:36%}
  .scene.big .kingpos{height:68%; bottom:24%}
  .tc{bottom:17%}
  .tc6,.tc7,.tc8,.tc9,.tc10,.tc11{bottom:3%}
  .logo{font-size:min(4rem, calc(var(--vh,800px) * .085), 5.4vw)}
  .jstrip{max-width:560px}
  .lamp{width:7.5%; font-size:4.2cqw}
}
@media (max-width:480px){
  .scene.big{aspect-ratio:auto; height:240px; --hb:38%; --hf:35%}
  .scene.big .kingpos{height:66%; bottom:26%}
  .tc{bottom:22%}
  .tc6,.tc7,.tc8,.tc9,.tc10,.tc11{bottom:2%}
  .lamp{width:11%; font-size:6.4cqw}
  .jstrip{gap:3px}
  .jt{width:calc((100% - 39px) / 14)}
}
@media (prefers-reduced-motion: reduce){
  .lt,.lamp,.jt.new{animation:none!important}
}
@media (min-width:481px) and (max-width:640px){
  .scene.big{aspect-ratio:16/5.9; min-height:0}
}

/* ================= 두더지 잡기(새 방식): 규칙 알림, 낱말 팻말, 차례 끝 정리 ================= */
.mready{display:flex; align-items:center; justify-content:center; gap:clamp(12px,3vw,32px); flex-wrap:wrap; width:100%}
.mready .hero .ch{width:calc(clamp(96px,22vw,150px) * var(--k))}
.mrulebox{display:flex; flex-direction:column; align-items:center; gap:6px; max-width:34em; min-width:0; background:var(--paper2); border:3px solid var(--edge); border-radius:20px; padding:12px 18px}
.mrule{font-size:clamp(1.3rem,4.4vw,1.9rem); color:var(--blue)}
.mtip{margin:0; font-size:1rem; line-height:1.45; text-wrap:pretty}
.mtip.dim{font-size:.9rem; color:var(--ink-soft)}
.wchips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.wchip{font-family:var(--font-display); font-size:1.05rem; line-height:1.3; border-radius:999px; padding:.1em .7em; border:2px solid var(--edge)}
.wchip.yes{background:var(--green); color:var(--on-accent)}
.wchip.nope{background:var(--paper); color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:2px; border-color:var(--line)}
.mprompt .mrule{font-size:clamp(1.25rem,4.2vw,1.7rem)}
.mprompt .mtip{font-size:.92rem; color:var(--ink-soft); max-width:26em}
.sign.s1{font-size:30px; font-size:clamp(24px,26cqw,56px); padding:0 .35em}
.sign.s2{font-size:24px; font-size:clamp(18px,18cqw,40px)}
.sign.s3{font-size:17px; font-size:clamp(14px,12.5cqw,28px)}
.sign.s4{font-size:14px; font-size:clamp(12px,9.2cqw,22px); white-space:nowrap}
.bonusline{margin:0; font-family:var(--font-display); font-size:1.1rem; color:var(--ink); background:var(--tint); border-radius:999px; padding:.1em 1em}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .mprompt .mrule{font-size:clamp(1.5rem,2.6vw,2.1rem)}
  .mprompt .mtip{font-size:1.05rem}
  .mready .hero .ch{width:calc(min(160px, var(--vh,800px) * .2) * var(--k))}
}

/* ================= 글자가 깨져 보이지 않게: 드문 글자가 든 줄은 모든 한글이 들어 있는 글꼴로 ================= */
.full,.choices.full .choice,.field.full .sign,.wchips.full .wchip{
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",sans-serif!important; font-weight:700; letter-spacing:-.01em;
}
.bigtxt.full{letter-spacing:0}
/* 놀이 고르기: 네 가지를 두 줄로 */
.modecard{flex-direction:row; text-align:left; gap:12px; padding:10px 14px}
.modecard svg{width:clamp(64px,12vw,100px)}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .modes{gap:10px 14px}
  .modecard{padding:10px 16px}
  .modecard svg{width:92px}
  body[data-ph="mode"] .stage{gap:10px}
  .opts{flex-direction:row; flex-wrap:wrap; justify-content:center; gap:8px 28px}
}
@media (max-width:640px){

  .modecard{padding:6px 10px}
}
/* 짝 맞추기 카드 뒷면: 자리 이름 */
.fa.bk{font-size:24px; font-size:calc(var(--u) * .42)}
body[data-ph="turn"] .hero .ch{width:calc(clamp(100px,24vw,140px) * var(--k))}
body[data-ph="turn"] .stage{gap:10px; justify-content:center}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  body[data-ph="turn"] .hero .ch{width:calc(min(150px, var(--vh,800px) * .17) * var(--k))}
}
@media (min-width:481px) and (max-width:640px){
  .modes{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  .modecard svg{width:56px}
  .mtxt small{font-size:.8rem}
}

/* 처음 상태로 되돌리기 */
.tleft>.rstlink{order:7} .tleft>.rstbox{order:4}
.rstlink{background:none; border:0; padding:2px 6px; font-size:.85rem; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px}
.rstbox{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; max-width:560px; background:var(--tint); border:2px solid var(--edge); border-radius:16px; padding:10px 12px}
.rstbox b{font-family:var(--font-display); font-weight:400; font-size:1.1rem}
.rstrow{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.rstbox .mini{color:var(--ink); border-color:var(--edge); font-size:.95rem}
.rstbox small{font-size:.8rem; color:var(--ink-soft); text-wrap:balance}

/* ---------- 힘 모으기(차례 퀴즈) ---------- */
.opthint{margin:0; max-width:34em; font-size:.9rem; line-height:1.45; color:var(--ink-soft,inherit); opacity:.85; text-align:center; text-wrap:pretty}
.teambox{display:flex; flex-direction:column; align-items:center; gap:6px; margin:2px auto 4px; font-size:.92rem}
.teambox.big{font-size:1rem; margin-bottom:10px}
.teambar{display:flex; align-items:center; gap:10px; width:min(340px,82vw)}

<script>
/* ================= 그림 ================= */
const FD = `style="font-family:var(--font-display)"`;
function outfit(o){
  const arm=(x,cls)=>`<g class="arm ${cls}"><rect class="ol" x="${x}" y="88" width="13" height="29" rx="6.5" fill="${o.top}"/><rect x="${x+.9}" y="100" width="11.2" height="4" fill="${o.st[0]}"/><rect x="${x+.9}" y="104" width="11.2" height="4" fill="${o.st[1]}"/><rect x="${x+.9}" y="108" width="11.2" height="4" fill="${o.st[2]}"/><circle class="ol" cx="${x+6.5}" cy="119" r="6" fill="${o.hand}"/></g>`;
  const feet=`<ellipse class="ol" cx="49" cy="166" rx="10" ry="5.5" fill="${o.shoe}"/><ellipse class="ol" cx="71" cy="166" rx="10" ry="5.5" fill="${o.shoe}"/>`;
  const bottom=o.skirt
    ? `<path class="ol" d="M41 110 H79 L96 160 Q60 171 24 160Z" fill="${o.bot}"/><path d="M27 151 Q60 162 93 151" fill="none" stroke="${o.hem}" stroke-width="3"/>`
    : `<rect class="ol" x="41" y="108" width="18" height="52" rx="7" fill="${o.bot}"/><rect class="ol" x="61" y="108" width="18" height="52" rx="7" fill="${o.bot}"/><rect x="42" y="150" width="16" height="5" fill="${o.hem}"/><rect x="62" y="150" width="16" height="5" fill="${o.hem}"/>`;
  const torso=`<path class="ol" d="M42 88 Q60 82 78 88 L83 115 Q60 121 37 115Z" fill="${o.top}"/>`
    +(o.vest?`<path d="M44 88 L52 88 L58 118 Q48 119 38.5 115Z M76 88 L68 88 L62 118 Q72 119 81.5 115Z" fill="${o.vest}"/>`:"")
    +`<path d="M50 86 L60 98 L70 86" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 98 q-2 11 -8 17 M60 98 q6 5 11 6" fill="none" stroke="${o.go}" stroke-width="3.5" stroke-linecap="round"/>`;
  return (o.pre||"")+feet+bottom+torso+arm(33,"armL")+arm(74,"armR");
}
/* ---------- 고를 수 있는 캐릭터: 얼굴은 동물 12종, 옷은 남자·여자 한복, 몸집은 아이·어른 ----------
   19판에서 새로 그렸다. 도형마다 '바탕색 + 빛과 그늘(공용 그러데이션) + 바탕색을 짙게 한 테두리'로 그려서 도톰해 보이게 한다 */
const INK = "#1E2A4A";
const _hx = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixc = (a,b,t) => "#"+_hx(a).map((v,i)=>Math.round(v+(_hx(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
const dk = (c,t) => { const [r,g,b]=_hx(c), warm=r>200&&g>150&&b<170&&r-b>70;        // 테두리·그늘 색. 노랑·살구빛은 보랏빛을 섞으면 탁해져서 갈색 쪽으로 짙게 한다
  return mixc(c, warm?"#7A3E10":"#2A1F45", t==null?(warm?.5:.46):t); };
const lt = (c,t) => mixc(c,"#FFFFFF",t==null?.45:t);
const SW = 1.7;
/* 그러데이션은 문서에 한 번만 넣어 두고 모든 캐릭터가 함께 쓴다(gv: 둥근 덩어리, gs: 위에서 아래로 그늘, gc: 볼, gg: 바닥 그림자, gold: 금박) */
const ARTDEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<radialGradient id="gv" cx=".33" cy=".2" r=".95"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".26" stop-color="#fff" stop-opacity=".06"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset=".58" stop-color="#2A1F45" stop-opacity="0"/><stop offset="1" stop-color="#2A1F45" stop-opacity=".24"/></radialGradient>
<radialGradient id="gc2"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".85"/><stop offset=".6" stop-color="#FFE9A8" stop-opacity=".35"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
<linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#2A1F45" stop-opacity=".24"/></linearGradient>
<linearGradient id="gh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A1F45" stop-opacity=".16"/><stop offset=".3" stop-color="#fff" stop-opacity=".1"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#2A1F45" stop-opacity=".2"/></linearGradient>
<radialGradient id="gc"><stop offset="0" stop-color="#FF6F91" stop-opacity=".62"/><stop offset=".6" stop-color="#FF8FA6" stop-opacity=".28"/><stop offset="1" stop-color="#FF8FA6" stop-opacity="0"/></radialGradient>
<radialGradient id="gg"><stop offset="0" stop-color="#1E2A4A" stop-opacity=".3"/><stop offset="1" stop-color="#1E2A4A" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B3"/><stop offset="1" stop-color="#F0AE2B"/></linearGradient>
</defs></svg>`;
document.body.insertAdjacentHTML("afterbegin", ARTDEFS);
const pth = (d,fill,o) => { o=o||{}; return `<path d="${d}" fill="${fill}" stroke="${o.s||dk(fill)}" stroke-width="${o.w||SW}" stroke-linejoin="round" stroke-linecap="round"/>`+(o.flat?"":`<path d="${d}" fill="url(#${o.g||"gv"})"/>`); };

/* 효과음과 배경 음악은 음원 파일 없이 Web Audio로 그 자리에서 만들어 낸다. 화면을 처음 누른 뒤부터 소리가 난다. */
const AU = {ctx:null, out:null, sfx:null, bgm:null};
const BGM_VOL = .75;
function au(){
  try{
    if(!AU.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      const c=AU.ctx=new C();
      AU.out=c.createDynamicsCompressor(); AU.out.threshold.value=-14; AU.out.ratio.value=5; AU.out.connect(c.destination);   // 소리가 겹쳐도 깨지지 않게 눌러 준다
      AU.sfx=c.createGain(); AU.sfx.gain.value=.8; AU.sfx.connect(AU.out);
      AU.bgm=c.createGain(); AU.bgm.gain.value=BGM_VOL; AU.bgm.connect(AU.out);
      const dl=c.createDelay(1), fb=c.createGain(), wet=c.createGain();                                                   // 음악에 은은한 울림
      dl.delayTime.value=.27; fb.gain.value=.26; wet.gain.value=.2;
      AU.bgm.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(AU.out);
    }
    if(AU.ctx.state==="suspended"&&!document.hidden) AU.ctx.resume();
    return AU.ctx;
  }catch(e){ return null; }
}

  const c=AU.ctx; o=o||{};

const DEG = {1:0,2:2,3:4,4:5,5:7,6:9,7:11};
function seq(str){
  return str.split(/\s+/).filter(x=>x&&x!=="|").map(tok=>{
    const m=/^(\d)([',]*)(?::(\d+))?$/.exec(tok); if(!m) return [null,1];
    let midi=null; if(+m[1]){ midi=67+DEG[+m[1]]; for(const ch of m[2]) midi+= ch==="'" ? 12 : -12; }
    return [midi, m[3]?+m[3]:1];
  });
}

    perc:[[[0,"buk",.16],[2,"deok",.1],[3,"kkwaeng",.03],[4,"kung",.12],[6,"deok",.1],[7,"kkwaeng",.03]],[[0,"buk",.16],[2,"gideok",.1],[4,"kung",.12],[5,"kkwaeng",.03],[6,"gideok",.1],[7,"kkwaeng",.03]]],

/* 가락·화음·반주·장단을 '언제 무엇을 칠지' 적은 목록으로 미리 풀어 둔다. 연주할 때는 곧 칠 것만 조금씩 꺼내 예약한다 */
function buildTrack(tr){
  tr.mel.n=seq(tr.mel.s); if(tr.harm) tr.harm.n=seq(tr.harm.s); tr.ch=tr.chords.split(" ");
  const ev=[], u=tr.u; let t=0;
  for(const [m,n] of tr.mel.n){ if(m) ev.push([t,(d,at)=>INS[tr.mel.ins](d,m,at,n*u,tr.mel.v)]); t+=n*u; }
  const total=t, bars=Math.round(total/(tr.bar*u));
  if(tr.harm){ let th=0; for(const [m,n] of tr.harm.n){ if(th>=total-.001) break; if(m) ev.push([th,(d,at)=>INS[tr.harm.ins](d,m,at,n*u,tr.harm.v)]); th+=n*u; } }
  for(let b=0;b<bars;b++){
    const tb=b*tr.bar*u, ch=CHORD[tr.ch[b%tr.ch.length]]||CHORD.G;
    if(tr.arp) tr.arp.pat.forEach((ix,i)=>{ if(ix!=null){ const note=ch[ix]+(tr.arp.oct||0)+12; ev.push([tb+i*u,(d,at)=>INS[tr.arp.ins](d,note,at,u*1.5,tr.arp.v)]); } });
    if(tr.bass) tr.bass.at.forEach((pos,i)=>{ const note=ch[0]-12+((tr.bass.hop&&i%2)?12:(i%2?7:0)); ev.push([tb+pos*u,(d,at)=>INS.bass(d,note,at,u*2.2,tr.bass.v)]); });
    const fill = (b%4===3)&&tr.perc.length>1 ? tr.perc[1] : tr.perc[0];                 // 네 마디마다 장단을 한 번 바꿔 친다
    for(const [pos,kind,v] of fill) ev.push([tb+pos*u,(d,at)=>INS[kind](d,at,v)]);
    if(tr.kk&&b%tr.kk===tr.kk-1){ ev.push([tb+(tr.bar-2)*u,(d,at)=>INS.kkwaeng(d,at,.035)]); ev.push([tb+(tr.bar-1)*u,(d,at)=>INS.kkwaeng(d,at,.035)]); }
    if(tr.jing&&b%tr.jing===0) ev.push([tb,(d,at)=>INS.jing(d,at,.06)]);
  }
  ev.sort((a,b)=>a[0]-b[0]); tr.ev=ev; tr.len=total; tr.bars=bars;
}
for(const k in TRACKS) buildTrack(TRACKS[k]);
const MU = {name:null, want:null, gain:null, base:0, i:0, timer:0};
function musicFor(ph){

}
function musicPump(){
  const c=AU.ctx; if(!c||!MU.name||c.state!=="running") return;
  const tr=TRACKS[MU.name], now=c.currentTime;
  if(MU.base+tr.ev[MU.i][0] < now-.05) MU.base=now+.1-tr.ev[MU.i][0];     // 화면이 가려졌다 돌아오면 그 자리에서 이어 간다
  let guard=0;
  while(MU.base+tr.ev[MU.i][0] < now+1.1 && guard++<300){
    try{ tr.ev[MU.i][1](MU.gain, MU.base+tr.ev[MU.i][0]); }catch(e){}
    if(++MU.i>=tr.ev.length){ MU.i=0; MU.base+=tr.len; }
  }
}
function musicStop(fade){

    try{ const t=AU.ctx.currentTime; g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+f); }catch(e){}
    setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, (f+.15)*1000);     // 끊으면 미리 넣어 둔 음도 함께 멎는다
  }

}

const fx=$("#fx"), ctx=fx.getContext("2d"); let parts=[], raf=0;
function confetti(n){
  if(reduced) return;
  fx.width=innerWidth; fx.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);
  const cols=["--red","--yellow","--blue","--green","--pink"].map(k=>cs.getPropertyValue(k).trim());
  for(let i=0;i<n;i++) parts.push({x:Math.random()*fx.width, y:-20-Math.random()*fx.height*.35,
    vx:(Math.random()-.5)*4, vy:2.5+Math.random()*4, s:6+Math.random()*9, r:Math.random()*6.28, vr:(Math.random()-.5)*.3, c:pickOne(cols)});
  if(!raf) raf=requestAnimationFrame(loop);
}
function loop(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.y<fx.height+30);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); ctx.restore(); }
  raf = parts.length ? requestAnimationFrame(loop) : 0;
}

/* ================= 그림 글자가 깨지지 않게 ================= */
/* 그림 글자(이모지)는 기기마다 들어 있는 것이 다르다. 오래된 기기에서는 새로 나온 그림이 빈 네모로 보인다.
   그래서 작은 그림판에 검은색과 빨간색으로 한 번씩 그려 본다. 제대로 된 그림은 제 색이 있어서 두 번이 똑같이 나오고,
   '없는 글자' 네모는 칠한 색을 따라 달라진다. 그렇게 깨지는 그림이 들어간 문제와 카드는 내지 않는다 */
const picOK = (()=>{
  const memo={}; let ctx=null;
  const draw = (ch,col) => { ctx.clearRect(0,0,36,36); ctx.fillStyle=col; ctx.fillText(ch,18,19); return ctx.getImageData(0,0,36,36).data; };
  return e => {
    if(e in memo) return memo[e];
    let ok=true;
    try{
      if(!ctx){ const cv=document.createElement("canvas"); cv.width=cv.height=36; ctx=cv.getContext("2d",{willReadFrequently:true});
        ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font="24px "+(getComputedStyle(document.body).fontFamily||"sans-serif"); }
      const a=draw(e,"#000"), b=draw(e,"#f00"); let ink=0, same=true;
      for(let i=0;i<a.length;i+=4){ if(a[i+3]>40) ink++; if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]) same=false; }
      ok = ink>0 && (same || e.codePointAt(0)<0x1F000);       // ✂ ☕ 같은 옛 기호는 색 없이 나와도 알아볼 수 있으니 그대로 쓴다
    }catch(err){ ok=true; }                                   // 알아볼 수 없으면 그대로 둔다
    return memo[e]=ok;
  };
})();
let EMO=null; try{ EMO=new RegExp("\\p{Extended_Pictographic}\\uFE0F?","gu"); }catch(e){}
const picsIn = q => EMO ? ([q.pic||"",...q.c.map(c=>typeof c==="string"?"":(c.e||""))].join(" ").match(EMO)||[]) : [];
const BADQ = {};                                              // 단계마다, 그림이 깨져서 낼 수 없는 문제 번호
function scanPics(){ for(const k in POOL){ BADQ[k]=new Set(); POOL[k].forEach((q,i)=>{ if(picsIn(q).some(e=>!picOK(e))) BADQ[k].add(i); }); } }

/* ================= 문제 뽑기 ================= */
/* 문제 갈래: '끝말잇기'나 '받침이 있는 글자'처럼 같은 갈래가 잇달아 나오면 겹치는 느낌이 든다. 그래서 문제마다 갈래를 매겨 두고 섞을 때 떼어 놓는다 */
const kindOf = q => q.say ? "받아쓰기" : q.tag ? q.tag : /^(동물|과일|탈것|학용품|먹을 것|입거나 쓰는 것)/.test(q.q) ? "무리 짓기" : /\(\s+\)/.test(q.q) ? "빈칸 채우기"
                  : q.q.replace(/'[^']*'|"[^"]*"|\([^)]*\)|[0-9]/g,"").trim().slice(0,12);
const KIND = {}, WORDS = {};
for(const k in POOL){ KIND[k]=POOL[k].map(kindOf); WORDS[k]=POOL[k].map(q=>[q.pic,q.big,ctext(q.c[0])].filter(x=>x&&x.length>1||x===q.pic&&x)); }
function fillQueue(pool){
  const P=POOL[pool], n=P.length, bad=BADQ[pool]||new Set();
  const all=P.map((_,i)=>i).filter(i=>!bad.has(i));
  let seen=new Set(used[pool]||[]), fresh=all.filter(i=>!seen.has(i));
  if(fresh.length<15||new Set(fresh.map(i=>KIND[pool][i])).size<6){     // 거의 다 풀었거나 몇 갈래만 남았으면 처음부터 다시. 방금 푼 서른 문제는 잠시 빼 둔다
    used[pool]=(used[pool]||[]).slice(-30); seen=new Set(used[pool]); fresh=all.filter(i=>!seen.has(i));
    if(fresh.length<15){ used[pool]=[]; fresh=all.slice(); }
  }
  /* 지난번에 틀린 문제는 한 판에 하나만, 다섯 번째쯤에 끼워 넣는다 */
  const old=shuffle((Array.isArray(missed[pool])?missed[pool]:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<n&&!bad.has(i))).slice(0,1);
  S.review[pool]=old.slice();
  /* 갈래별로 나눠 놓고 하나씩 뽑는다. 바로 앞 네 문제와 갈래가 같으면 뽑지 않고, 문제가 많은 갈래만 자꾸 나오지 않게 남은 수의 제곱근만큼만 무게를 둔다 */
  const by={}; for(const i of shuffle(fresh.filter(i=>!old.includes(i)))) (by[KIND[pool][i]]||(by[KIND[pool][i]]=[])).push(i);
  let kinds=Object.keys(by); const q=[], lastK=[], lastW=[];
  while(kinds.length){
    const gap=Math.min(4,kinds.length-1), recent=gap?lastK.slice(-gap):[], cand=kinds.filter(k=>!recent.includes(k));
    let tot=0; const acc=cand.map(k=>(tot+=Math.sqrt(by[k].length))), r=Math.random()*tot;
    const k=cand[Math.max(0,acc.findIndex(x=>x>r))], arr=by[k];
    let j=arr.findIndex(i=>!WORDS[pool][i].some(w=>lastW.includes(w))); if(j<0) j=0;      // 같은 낱말·같은 그림도 가까이 두지 않는다
    const i=arr.splice(j,1)[0]; q.push(i); lastK.push(k); lastW.push(...WORDS[pool][i]); while(lastW.length>12) lastW.shift();
    if(!arr.length){ delete by[k]; kinds=Object.keys(by); }
  }
  old.forEach((i,x)=>q.splice(Math.min(4+5*x,q.length),0,i));
  S.qq[pool]=q;
}
/* 맞혔는지 적어 둔다. 틀린 문제는 같은 판에서는 다시 내지 않는다(금방 또 나오면 겹치는 느낌이 크다). 끝나고 '틀린 문제 다시 보기'로 보여 주고, 다음 판에 하나만 다시 낸다 */
const autoRead = () => { const c=S.cur; if(!meta.autoread||!koVoice||!c||c.pool>2) return; const q=POOL[c.pool][c.qid], t=q.say||((q.big&&!/[○→·]/.test(q.big)?q.big+". ":"")+q.q);
  setTimeout(()=>{ if(S.cur===c&&c.state==="open") speak(t); },450); };
function record(pool,qid,ok,pi){
  const st=meta.stats[pool]; if(st&&!(S.daily&&S.dy&&S.dy.practice)){ st.a++; if(ok) st.r++; saveMeta(); }
  const m=Array.isArray(missed[pool])?missed[pool]:(missed[pool]=[]);

    if(S.miss[pi]&&!S.miss[pi].some(x=>x[0]===pool&&x[1]===qid)) S.miss[pi].push([pool,qid]);
  }

}
const isRetry = (pool,qid) => (S.re[pool]||[]).includes(qid) ? "다시 도전" : (S.review[pool]||[]).includes(qid) ? "지난번에 틀린 문제" : "";
function nextQ(pool){
  if(!BADQ[1]) scanPics();

  const q=S.qq[pool].shift();

}
